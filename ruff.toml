# Lint config for the Python eval + functional layers.
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
]

[lint.isort]
known-first-party = ["mcp_client", "reporting", "run"]
