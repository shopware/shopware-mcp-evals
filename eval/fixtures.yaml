# LLM Eval Fixtures
#
# Only the three discovery meta-tools (shopware-tool-search, -toolsets-list,
# -toolset-enable) are advertised by default; every other tool is deferred and
# must be discovered and enabled. So each non-meta fixture belongs to a toolset.
#
# Coverage rule: every advertised tool has at least 3 prompts, and they must
# differ in KIND, not just wording — a canonical phrasing, a real-user
# paraphrase that avoids the tool's own vocabulary, and a boundary case framed
# next to a sibling tool. Three restatements of the same sentence only prove the
# model can match one phrasing. tests/test_fixtures.py enforces the count.
#
# Fields:
#   expected_tool:    the tool that should be selected. The first NON-meta tool
#                     call is the graded one; discovery meta-calls on the way to
#                     it are executed and fed back, not graded.
#   acceptable_tools: (optional) list of additional tool names that also count
#                     as correct — for genuinely multi-valid prompts.
#   expected_toolset: (optional) the toolset containing expected_tool — grades
#                     whether toolset-enable picked the right group in discovery
#                     mode. Only the `meta` fixtures omit it (they need no toolset).
#   max_steps:        (optional) per-fixture override of the discovery step cap.
#   expect_no_tool:   (negative fixtures only) the right answer is that no tool
#                     applies; calling anything is the failure.
#   expect_result:    (optional) how much of the executed call to assert on.
#                     Defaults to `accepted`, and every fixture currently uses
#                     that default deliberately — see below.
#   notes:            why this case is interesting (disambiguation, chaining...)
#
# expect_result tiers:
#   accepted  the arguments passed validation and the server took the call. An
#             empty or not-found result is fine. This is the honest tier for a
#             fixture that has to invent an id: the model cannot know a real
#             UUID, so "not found" proves the call was well-formed, which is the
#             thing under test.
#   data      the call should also return something. Takes `has_keys`,
#             `min_items` and `contains` predicates against the payload.
#   none      selection only. Automatic for tools that cannot be executed
#             safely (toolclass.UNSAFE), so it rarely needs setting by hand.
#
# Why everything is on `accepted` for now: the `data` tier needs real payload
# shapes to assert against, and those have not been observed yet — the demo data
# is generated, and the seeding step is explicitly non-fatal, so a fixture
# asserting on a shape guessed from the schema would fail for reasons that have
# nothing to do with tool quality. Upgrade fixtures to `data` from an actual
# run's payloads, not from the schema.
#
# Categories:
#   unambiguous     one clear tool
#   disambiguation  multiple tools could apply, only one is correct
#   chain           multi-step task; grade the FIRST (non-meta) tool
#   meta            the discovery meta-tool itself is the right answer
#   discovery       deep-deferred tools that exercise the discovery layer
#
# Values inside a prompt — the rule that two broken fixtures cost us:
#
# Grading now EXECUTES the tool the model chose and asserts the result (recovery
# allowed), so a value in a prompt IS sent to the server. What a fake value costs
# therefore depends on how the tool rejects it:
#
#   fine       a phantom 32-char hex id whose only failure mode is "not found".
#              On the `accepted` tier a well-formed call that finds nothing PASSES
#              — the point being that the call was valid, which is all the model
#              could control without knowing a real id. Shopware keys are
#              Uuid::randomHex (32 lowercase hex, no dashes) and cart tokens share
#              that shape, so a fake must too: 'abc123' or a Stripe-style
#              'ord_55501' is the wrong shape and reads as a different platform.
#              Skill names ('storefront-controller') are the same — none of the
#              three any load-skill fixture uses exists, and they pass regardless.
#   {placeholder}
#              a value the tool rejects by SHAPE, not by absence, so a fake can
#              never pass. merchant-* and theme-config reject a non-UUID
#              salesChannelId with "Value is not a valid UUID" — an
#              invalid_arguments failure, not a not-found the `accepted` tier
#              forgives. These prompts carry `{sales_channel_id}`, which the
#              runner substitutes with a REAL id read off the live lane at startup
#              (see resolve_lane_substitutions in eval/runner.py). It stays a
#              placeholder in the file because the id is per-instance and a
#              hardcoded UUID goes stale on every other lane.
#   NOT fine   a vague reference the model must resolve before it can call the
#              expected tool: "our main sales channel", "the default warehouse".
#              The lookup is correct behaviour, so the model reaches for
#              entity-search and the fixture scores it as the wrong tool. The
#              {placeholder} above is the fix: hand over the concrete id instead
#              of a phrase the model has to turn into one.
#
# `checkout_methods_shipping` cost us both mistakes in turn. It first said "our
# main sales channel" (a NOT-fine vague reference); both models went looking for
# the channel and were graded wrong for a forced lookup. Rewriting it to name the
# channel ("the Storefront sales channel") only moved the failure downstream —
# under execution grading the model dutifully passed "Storefront" and the tool
# rejected it as an invalid UUID. The durable fix is the {placeholder}: a real,
# resolvable id handed straight to the model, so the fixture tests its actual
# subject (the "delivery options" vocabulary gap) and nothing else.
#
# Keeping it as a `chain` fixture asserting the lookup was tried
# (checkout_methods_needs_channel_lookup) and removed: a prompt with two
# defensible first moves — resolve the channel, or call the tool directly — has
# no single correct first call to grade, and turned a coin flip into a both-fail.
#
# Two habits that would have caught all of this earlier:
#
#   Check for flakiness before rewording. `load_skill_entity_definition` looked
#   like a phrasing bug across three CI runs; an A/B of both wordings on one
#   instance reversed the result. See its notes.
#
#   Verify against CI's descriptions, not a local instance's. The fixture above
#   was validated locally while this machine's merchant-checkout-methods and
#   shopware-entity-search descriptions differed from CI's — two of the eleven
#   that had drifted — so the local pass meant nothing. `python -m eval.drift`
#   against tool-history/latest.json tells you whether they match.

