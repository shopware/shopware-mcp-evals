  - id: disambig_delete_vs_upsert
    category: disambiguation
    prompt: "Remove the customer record 11111111111111111111111111111111 from the database entirely."
    expected_tool: shopware-entity-delete
    expected_toolset: entity
    notes: >
      A hard delete → entity-delete. Not an upsert flipping an active/deleted
      flag, which is the tempting near-miss.

  - id: disambig_cart_manage_quantity
    category: disambiguation
    prompt: "Change the quantity of line item 44f9e8d7c6b5a4938271605f4e3d2c1b in cart abc12345d6e7f8091a2b3c4d5e6f7081 to 5 in the Storefront sales channel."
    expected_tool: merchant-cart-manage
    expected_toolset: merchant-sales
    notes: Editing an existing cart's line items → cart-manage (action=update), not cart-checkout.

  - id: disambig_checkout_vs_cart_manage
    category: disambiguation
    prompt: "Everything in cart abc12345d6e7f8091a2b3c4d5e6f7081 is final — complete the purchase for customer 11111111111111111111111111111111 in sales channel {sales_channel_id}."
    expected_tool: merchant-cart-checkout
    expected_toolset: merchant-sales
    notes: Finalizing a cart into an order → cart-checkout; cart-manage only edits line items.

  - id: disambig_order_state_vs_summary
    category: disambiguation
    prompt: "Cancel order 10009 — move it into the cancelled state."
    expected_tool: shopware-order-state
    expected_toolset: order
    notes: >
      Transitioning the order state machine → order-state. merchant-order-summary
      only reads an order and cannot change it.

  - id: disambig_config_write_vs_theme
    category: disambiguation
    prompt: "Set core.listing.productsPerPage to 48."
    expected_tool: shopware-system-config-write
    expected_toolset: system-config
    notes: >
      A system_config key → system-config-write. theme-config writes theme
      variables only and does not reach core.* settings.

  - id: disambig_list_vs_load_skill
    category: disambiguation
    prompt: "Show me the catalogue of skills with a one-line description of each."
    expected_tool: swag-dev-tools-list-skills
    expected_toolset: dev-skills
    notes: The index → list-skills; load-skill returns one skill's full body.

  - id: disambig_notifications_vs_logs
    category: disambiguation
    prompt: "Something failed in the background — is there an admin notification about it?"
    expected_tool: swag-dev-tools-notifications
    expected_toolset: dev-extensions
    notes: >
      The admin notification store → notifications. log-search reads Monolog
      files, which is the tempting near-miss for "something failed".

  - id: disambig_scaffold_vs_load_skill
    category: disambiguation
    prompt: "Create the file skeleton for a new Shopware app."
    expected_tool: swag-dev-tools-scaffold
    expected_toolset: dev-scaffold
    notes: >
      Generating files → scaffold. load-skill only returns documentation about
      how to write them, which is the near-miss here.

  # -------------------------------------------------------------------------
  # Multi-step chains — verify the FIRST (non-meta) tool selected
  # -------------------------------------------------------------------------

  - id: chain_customer_then_order
    category: chain
    prompt: "Find the customer b.meyer@gmail.com and show me their most recent order."
    expected_tool: merchant-customer-lookup
    expected_toolset: merchant-analytics
    max_steps: 8
    notes: Step 1 is customer lookup; step 2 would be order-summary.

  - id: chain_search_then_cart
    category: chain
    prompt: "Look up product number SHIRT-001, then add one to a new cart in the Storefront sales channel."
    expected_tool: shopware-entity-search
    acceptable_tools: [merchant-storefront-search]
    expected_toolset: entity
    max_steps: 8
    notes: >
      Step 1 finds the product; step 2 is cart-manage. entity-search is the
      exact-field lookup, but the "Storefront sales channel" framing makes
      storefront-search a defensible first step too — accept either.

  - id: chain_schema_then_search
    category: chain
    prompt: "First check the product entity schema, then search for active products sorted by name."
    expected_tool: shopware-entity-schema
    expected_toolset: entity
    max_steps: 8
    notes: Explicitly ordered — schema first.

  - id: chain_summary_then_state
    category: chain
    prompt: "Look up order 10042 and, if it has already been paid, mark it as shipped."
    expected_tool: merchant-order-summary
    expected_toolset: merchant-analytics
    max_steps: 8
    notes: >
      Read before write: step 1 is order-summary, step 2 order-state. Grading the
      first call catches models that jump straight to the state transition.

  - id: chain_config_read_then_write
    category: chain
    prompt: "Check the current value of core.listing.productsPerPage and then double it."
    expected_tool: shopware-system-config-read
    expected_toolset: system-config
    max_steps: 8
    notes: '"Double it" is only computable after a read — step 2 is system-config-write.'

  - id: chain_extensions_then_logs
    category: chain
    prompt: "Check whether SwagMcpDevTools is active, then look for any errors it has logged."
    expected_tool: swag-dev-tools-list-extensions
    expected_toolset: dev-extensions
    max_steps: 8
    notes: >
      Spans two toolsets (dev-extensions then dev-logs), so discovery mode has to
      enable a second toolset mid-run.

  # -------------------------------------------------------------------------
  # Meta — the discovery meta-tool itself is the correct answer.
  # In discovery mode the FIRST tool call of any kind is graded.
  # -------------------------------------------------------------------------

  - id: meta_list_toolsets
    category: meta
    prompt: "What groups of tools does this MCP server offer that I could enable?"
    expected_tool: shopware-toolsets-list
    notes: Asking about available tool groups → toolsets-list, not tool-search.

  - id: meta_toolsets_inventory
    category: meta
    prompt: "Show me every toolset on this server and how many tools each one contains."
    expected_tool: shopware-toolsets-list
    notes: Inventory phrasing — the counts are part of the toolsets-list payload.

  - id: meta_toolsets_enabled_state
    category: meta
    prompt: "Which capability groups are already active in my session right now?"
    expected_tool: shopware-toolsets-list
    notes: >
      Enabled-state question → toolsets-list, which reports it per toolset.
      Neither tool-search nor toolset-enable answers this.

  - id: meta_enable_toolset
    category: meta
    prompt: "Enable the analytics toolset so I can run sales reports in this session."
    expected_tool: shopware-toolset-enable
    notes: >
      Explicit enable request. The model may call shopware-toolsets-list first
      to resolve the exact toolset name — that is valid discovery flow and the
      runner treats it as a non-terminal step, grading the eventual enable call.

  - id: meta_enable_dev_logs
    category: meta
    prompt: "Turn on the dev-logs toolset."
    expected_tool: shopware-toolset-enable
    notes: Exact toolset name given — the simplest possible enable.

  - id: meta_enable_media_group
    category: meta
    prompt: "I need the media tools available — activate that group for this session."
    expected_tool: shopware-toolset-enable
    notes: Group named by intent rather than by its exact toolset key.

  - id: meta_tool_search
    category: meta
    prompt: "Is there a tool for uploading images to the media library? Find it for me."
    expected_tool: shopware-tool-search
    notes: Explicit capability search → tool-search, not toolsets-list.

  - id: meta_search_capability
    category: meta
    prompt: "Search the tool catalogue for anything related to changing theme colors."
    expected_tool: shopware-tool-search
    notes: Free-text capability query → tool-search.

  - id: meta_search_order_state
    category: meta
    prompt: "Do you have anything that can transition an order's status? Look it up in the catalogue."
    expected_tool: shopware-tool-search
    notes: >
      Capability question about a specific tool → tool-search. toolsets-list
      would only return group names, which does not answer it.

  # -------------------------------------------------------------------------
  # Discovery probes — deep-deferred tools with no default-surface sibling,
  # exercising search/toolset quality end to end.
  # -------------------------------------------------------------------------

  - id: discovery_entity_delete
    category: discovery
    prompt: "Permanently delete the product with ID 001cd6c6df7e42c38530de7b53dfcf25."
    expected_tool: shopware-entity-delete
    expected_toolset: entity
    notes: >
      Delete is deferred; nothing on the default surface deletes. The model must
      discover entity-delete (and should later use dryRun first — not graded here).

  - id: discovery_theme_color
    category: discovery
    prompt: "Change the primary color of the theme for sales channel {sales_channel_id} to #ff0000."
    expected_tool: shopware-theme-config
    expected_toolset: theme
    notes: >
      theme-config is deferred in the 'theme' toolset. Probes whether search
      ranks it for theme/color queries and whether the model reaches it.

  # -------------------------------------------------------------------------
  # Negative — the right answer is that no tool applies
  # -------------------------------------------------------------------------
  # Every other fixture asks "is tool X picked when X is right", which measures
  # recall only. A description broad enough to also win prompts it has no
  # business winning still scores 100% on that. These are the other half: a
  # plausible, adjacent admin request the catalogue genuinely cannot serve,
  # where reaching for any tool is the failure.
  #
  # Two rules, both learned the hard way:
  #
  #   * The ask must have no legitimate first step. "Export all orders to CSV
  #     and email it" is NOT a valid negative — fetching the orders is a
  #     reasonable opening move, so a model calling entity-search is behaving
  #     correctly and the fixture would punish it. Every prompt below is
  #     external or infrastructural, so no shop-data lookup helps.
  #   * Meta calls are free. Searching the catalogue, finding nothing and then
  #     declining is exactly the behaviour being tested, and passes.
  #
  # They expire: if the server grows the capability, the fixture becomes a false
  # accusation. `notes` says what would answer it, so the drift PR can tell.

  - id: negative_carrier_label
    category: negative
    prompt: "Print the DHL shipping label for our latest parcel and send it to the warehouse printer."
    expect_no_tool: true
    notes: >
      Would need a carrier/label integration. Nothing here talks to a carrier;
      order tooling changes states, it does not produce labels. Adjacent to the
      order group on purpose — that is the group most likely to bite.

  - id: negative_newsletter_campaign
    category: negative
    prompt: "Send our spring sale announcement out to everyone on the mailing list this afternoon."
    expect_no_tool: true
    notes: >
      Would need a mail/campaign sender. Customer data is readable here, but
      nothing sends mail — the risk is a customer-lookup tool biting on
      "everyone on the mailing list".

  - id: negative_subscription_billing
    category: negative
    prompt: "Set up a recurring monthly billing plan so premium members are charged automatically."
    expect_no_tool: true
    notes: >
      Would need subscription/recurring-billing capability, which is not in this
      catalogue. Cart and checkout tools handle one-off purchases only.

  - id: negative_social_post
    category: negative
    prompt: "Publish the new collection announcement to our Instagram and Facebook accounts."
    expect_no_tool: true
    notes: >
      Would need social integrations. Entirely outside the shop; included as the
      clear-cut control against which the adjacent negatives can be read.

  - id: negative_cache_clear
    category: negative
    prompt: "Clear the application cache and warm it back up, the frontend is serving stale content."
    expect_no_tool: true
    notes: >
      Would need console/cache administration. The dev-tools group is the
      hazard: it exposes logs, extensions and scaffolding, so a description
      broad enough to read as "developer operations" would bite here.

  - id: negative_restore_backup
    category: negative
    prompt: "Roll us back to yesterday evening's database snapshot, a bad import wrecked the catalogue."
    expect_no_tool: true
    notes: >
      Would need backup/restore administration. Destructive and unserveable, so
      the tool most at risk of biting is entity-delete — which is exactly the
      one that must not.
