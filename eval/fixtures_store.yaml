# LLM Eval Fixtures — Store API endpoint (/store-api/_mcp)
#
# The same discovery model as admin, as core intends (shopware/shopware#18298).
# A fresh session advertises the three meta-tools only. Since agentic-commerce
# 1.4.0 (shopware/agentic-commerce#261) the thirteen UCP buyer-journey tools are
# deferred behind the `ucp` toolset, so every UCP fixture carries
# `expected_toolset: ucp`; the three store-api-context fixtures carry
# `expected_toolset: store-api`. tests/test_fixtures.py checks both against
# tool-history/store.json.
#
# 1.3.0 had put the UCP tools on the default surface by claiming core's
# reserved `discovery` group, and these fixtures then carried no toolset and
# measured selection only. If a plugin build does that again, the fixture tests
# fail on the mirror rule rather than grading a discovery that never happened.
# Run with:
#   python -m eval.runner --endpoint store
#
# Fields are identical to fixtures.yaml (see its header), and the same coverage
# rule applies: at least 3 prompts per tool, differing in kind rather than
# wording. Buyer-journey tools sit unusually close together (cart-cancel vs
# checkout-cancel, cart-get vs checkout-get), so most of the extra prompts are
# boundary cases between neighbouring stages of the funnel.
#
# Grading executes the call, as on admin: read-only UCP tools run as they are,
# mutating ones with the dryRun the plugin declares (ucp.py), and the result is
# asserted.
#
# So an id in a prompt is sent to the server, and must be real where the tool
# would do anything but answer "not found" for it. `{product_id}` is a product a
# cart accepts. `{cart_id}`, `{line_item_id}` and `{checkout_id}` are one cart
# and one checkout created at startup under --seed-lane (ucp.seed_lane); without
# it their fixtures are skipped. The invented ids that replaced cost five
# fixtures a night: the model read the cart before changing it, got "not
# found", and was graded for the read. Two invented ids remain on purpose: the
# second product in `catalog_lookup`, which a lookup answers by omitting, and
# the order id, which a guest's read is refused for whether it exists or not.

fixtures:

  # -------------------------------------------------------------------------
  # Catalog
  # -------------------------------------------------------------------------

  - id: catalog_search
    category: unambiguous
    prompt: "Search the storefront catalog for running shoes."
    expected_tool: search_catalog
    expected_toolset: ucp
    notes: Free-text catalog discovery → catalog-search.

  - id: catalog_search_shopper_intent
    category: unambiguous
    prompt: "I'm looking for a gift under 50 euros — what have you got?"
    expected_tool: search_catalog
    expected_toolset: ucp
    notes: Open-ended shopper browse with no product ID and no "search" keyword.

  - id: disambig_search_vs_lookup
    category: disambiguation
    prompt: "Do you sell anything in blue? Show me a few options."
    expected_tool: search_catalog
    expected_toolset: ucp
    notes: >
      No identifiers, so lookup is impossible — this has to be a text query.
      The mirror image of disambig_lookup_vs_search.

  - id: catalog_lookup
    category: disambiguation
    prompt: "Load the full product details for product IDs {product_id} and 0c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f from the catalog."
    expected_tool: lookup_catalog
    expected_toolset: ucp
    notes: Known IDs → catalog-lookup, not catalog-search (which is a text query).

  - id: catalog_lookup_price
    category: unambiguous
    prompt: "Get the current price and availability for product {product_id}."
    expected_tool: lookup_catalog
    expected_toolset: ucp

  - id: disambig_lookup_vs_search
    category: disambiguation
    prompt: "Before I add it to my basket, confirm that product {product_id} is still in stock."
    expected_tool: lookup_catalog
    expected_toolset: ucp
    notes: >
      An ID is in hand → lookup. The "add to basket" framing is a distractor
      toward cart-update; nothing is being added yet.

  # -------------------------------------------------------------------------
  # Cart
  # -------------------------------------------------------------------------

  - id: cart_create
    category: unambiguous
    prompt: "Start a brand new shopping cart for me."
    expected_tool: create_cart
    expected_toolset: ucp

  - id: cart_create_start_shopping
    category: unambiguous
    prompt: "I'd like to start shopping — open a basket for me."
    expected_tool: create_cart
    expected_toolset: ucp
    notes: '"Basket" rather than "cart" — vocabulary coverage.'

  - id: chain_cart_create_then_add
    category: chain
    prompt: "Create a cart for me and put product {product_id} in it."
    expected_tool: create_cart
    expected_toolset: ucp
    max_steps: 8
    notes: >
      No cart ID exists yet, so step 1 must be cart-create and step 2
      cart-update. Catches models that jump straight to adding a line item.

  - id: cart_get
    category: unambiguous
    prompt: "Show me the current contents of cart {cart_id}."
    expected_tool: get_cart
    expected_toolset: ucp

  - id: cart_get_total
    category: unambiguous
    prompt: "What does cart {cart_id} come to in total?"
    expected_tool: get_cart
    expected_toolset: ucp
    notes: Totals are part of the cart payload — a read, not a checkout step.

  - id: disambig_cart_get_vs_checkout_get
    category: disambiguation
    prompt: "What's in my basket right now — {cart_id}? I haven't started checking out yet."
    expected_tool: get_cart
    expected_toolset: ucp
    notes: >
      Cart-stage read → cart-get. checkout-get needs a checkout session, which
      does not exist here.

  - id: cart_update
    category: disambiguation
    prompt: "Set the quantity of line item {line_item_id} in cart {cart_id} to 3."
    expected_tool: update_cart
    expected_toolset: ucp
    notes: Writing new line-item state to an existing cart → cart-update, not cart-get/create.

  - id: cart_update_add_more
    category: unambiguous
    prompt: "Add two more of product {product_id} to cart {cart_id}."
    expected_tool: update_cart
    expected_toolset: ucp
    notes: Adding to an existing cart → cart-update; cart-create would discard it.

  - id: cart_update_remove_line
    category: unambiguous
    prompt: "Take line item {line_item_id} out of cart {cart_id}."
    expected_tool: update_cart
    expected_toolset: ucp
    notes: >
      Removing one line → cart-update. cart-cancel is the near-miss and would
      throw away the whole cart.

  - id: cart_cancel
    category: unambiguous
    prompt: "Discard cart {cart_id}, I don't want it anymore."
    expected_tool: cancel_cart
    expected_toolset: ucp

  - id: cart_cancel_delete
    category: unambiguous
    prompt: "Empty and abandon cart {cart_id} completely."
    expected_tool: cancel_cart
    expected_toolset: ucp

  - id: disambig_cart_cancel_vs_checkout_cancel
    category: disambiguation
    prompt: "Throw away the shopping cart {cart_id} — I never started a checkout for it."
    expected_tool: cancel_cart
    expected_toolset: ucp
    notes: Cart-stage abandon → cart-cancel, not checkout-cancel.

  - id: discount_apply
    category: unambiguous
    prompt: "Apply the discount code SUMMER10 to cart {cart_id}."
    expected_tool: apply_discount
    expected_toolset: ucp

  - id: discount_apply_voucher
    category: unambiguous
    prompt: "I have a voucher code WELCOME5 — use it on cart {cart_id}."
    expected_tool: apply_discount
    expected_toolset: ucp
    notes: '"Voucher" rather than "discount code" — vocabulary coverage.'

  - id: disambig_discount_vs_cart_update
    category: disambiguation
    prompt: "Redeem promotion code BLACKFRIDAY on cart {cart_id} before I check out."
    expected_tool: apply_discount
    expected_toolset: ucp
    notes: >
      A promotion code has its own endpoint → discount-apply, not cart-update
      (which is for line items) and not checkout-create.

  # -------------------------------------------------------------------------
  # Checkout
  # -------------------------------------------------------------------------

  - id: checkout_create
    category: unambiguous
    prompt: "Begin checkout for cart {cart_id}."
    expected_tool: create_checkout
    expected_toolset: ucp

  - id: checkout_create_ready_to_buy
    category: unambiguous
    prompt: "I'm ready to buy what's in cart {cart_id} — take me to checkout."
    expected_tool: create_checkout
    expected_toolset: ucp

  - id: disambig_checkout_create_vs_complete
    category: disambiguation
    prompt: "Convert cart {cart_id} into a checkout session."
    expected_tool: create_checkout
    expected_toolset: ucp
    notes: >
      Opening a checkout → checkout-create. checkout-complete places the order
      and needs an existing session ID, which this prompt does not supply.

  - id: checkout_get
    category: unambiguous
    prompt: "What is the current status of checkout session {checkout_id}?"
    expected_tool: get_checkout
    expected_toolset: ucp

  - id: checkout_get_paid
    category: unambiguous
    prompt: "Has checkout {checkout_id} been paid yet?"
    expected_tool: get_checkout
    expected_toolset: ucp

  - id: checkout_get_totals
    category: unambiguous
    prompt: "Fetch the current state of checkout session {checkout_id} including its totals."
    expected_tool: get_checkout
    expected_toolset: ucp
    notes: Totals at the checkout stage → checkout-get, not cart-get.

  - id: checkout_update
    category: disambiguation
    prompt: "Set the shipping address on checkout session {checkout_id} to Musterstrasse 1, 48624 Schöppingen, Germany."
    expected_tool: update_checkout
    expected_toolset: ucp
    notes: >
      Editing an open checkout → update_checkout, not create/complete.

      The prompt carries the address because it did not, and a model that has
      been asked to set an address nobody gave it SHOULD ask for one rather than
      invent it. It graded as no_tool_call on nightly 35825932203 for exactly
      that reason. The address is the only thing that was missing:
      update_checkout needs every line item resent (update is PUT, not PATCH),
      and get_checkout on this id returns a full checkout (~4.9 KB on that run)
      to read them from. checkout_update_email, which supplies its value, took
      exactly that path — read, then write — and passed.

  - id: checkout_update_email
    category: unambiguous
    prompt: "Change the email address on checkout {checkout_id} to buyer@example.com."
    expected_tool: update_checkout
    expected_toolset: ucp

  - id: checkout_update_shipping_option
    category: unambiguous
    prompt: "Pick the express delivery option for checkout session {checkout_id}."
    expected_tool: update_checkout
    expected_toolset: ucp
    notes: >
      Selecting a shipping method is a checkout field write, not a new checkout.

      Failing on nightly 35825932203, and probably NOT because of a description
      — read this before editing one. The model read the checkout (get_checkout
      succeeded, ~4.8 KB) and then stopped without writing. The likeliest reason
      is that the checkout offers no delivery option called "express", which
      would make the prompt unanswerable on this lane; that is unverified, since
      the eval record does not keep the read's payload. Check the checkout's
      fulfillment options before touching update_checkout's description.

  - id: checkout_complete
    category: disambiguation
    prompt: "Everything looks good — place the order for checkout session {checkout_id}."
    expected_tool: complete_checkout
    expected_toolset: ucp
    notes: Finalizing/placing the order → checkout-complete, not checkout-update.

  - id: checkout_complete_confirm_pay
    category: unambiguous
    prompt: "Confirm and pay for checkout {checkout_id}."
    expected_tool: complete_checkout
    expected_toolset: ucp

  - id: checkout_complete_submit
    category: unambiguous
    prompt: "Submit checkout session {checkout_id} — I authorize the payment."
    expected_tool: complete_checkout
    expected_toolset: ucp

  - id: checkout_cancel
    category: unambiguous
    prompt: "Cancel checkout session {checkout_id}."
    expected_tool: cancel_checkout
    expected_toolset: ucp

  - id: checkout_cancel_abort
    category: unambiguous
    prompt: "Abort checkout session {checkout_id}."
    expected_tool: cancel_checkout
    expected_toolset: ucp

  - id: disambig_checkout_cancel_vs_cart_cancel
    category: disambiguation
    prompt: "Stop the checkout {checkout_id} — I don't want to complete it, but keep my cart."
    expected_tool: cancel_checkout
    expected_toolset: ucp
    notes: >
      "Keep my cart" rules out cart-cancel: only the checkout session is being
      cancelled.

  # -------------------------------------------------------------------------
  # Order & context
  # -------------------------------------------------------------------------

  - id: order_get
    category: unambiguous
    prompt: "Show me the details of order 019f0a186a007d47bafa9bc8bb53c140."
    expected_tool: get_order
    expected_toolset: ucp

  - id: order_get_tracking
    category: unambiguous
    prompt: "Track order 019f0a186a007d47bafa9bc8bb53c140 — has it shipped yet?"
    expected_tool: get_order
    expected_toolset: ucp

  - id: disambig_order_get_vs_checkout_get
    category: disambiguation
    prompt: "What did I end up paying for order 019f0a186a007d47bafa9bc8bb53c140?"
    expected_tool: get_order
    expected_toolset: ucp
    notes: >
      A placed order → order-get. checkout-get is for a session that has not
      been completed yet.

  - id: store_context
    category: unambiguous
    prompt: "Which sales channel, currency and language is this session using, and am I logged in as a customer?"
    expected_tool: shopware-store-api-context
    expected_toolset: store-api
    notes: Reading the session's sales-channel context → store-api-context.

  - id: store_context_currency
    category: unambiguous
    prompt: "Which currency and language will prices be shown in for me?"
    expected_tool: shopware-store-api-context
    expected_toolset: store-api

  - id: store_context_logged_in
    category: unambiguous
    prompt: "Am I signed in, and which shop am I browsing?"
    expected_tool: shopware-store-api-context
    expected_toolset: store-api
    notes: Customer login state is part of the context payload — not a cart or order read.

  # -------------------------------------------------------------------------
  # Negative — the right answer is that no tool applies
  # -------------------------------------------------------------------------
  # See the block in fixtures.yaml for the rules. The storefront surface is
  # narrower than admin, so these probe the boundary that matters here: a
  # shopper asking for something only an admin (or nobody) can do.

  - id: negative_change_price
    category: negative
    prompt: "Drop the price on this jacket to 19.99 for me, it is cheaper on your competitor's site."
    expect_no_tool: true
    notes: >
      Pricing is an admin capability and is not on the Store API surface at all.
      The hazard is a catalogue/search tool treating this as a product operation
      rather than declining.

  - id: negative_cancel_and_refund
    category: negative
    prompt: "Cancel the order I placed this morning and put the money back on my card."
    expect_no_tool: true
    notes: >
      Storefront checkout creates orders; it does not cancel them or move money.
      Adjacent to cart and checkout, which is where an over-broad description
      would bite.

  - id: negative_loyalty_points
    category: negative
    prompt: "Enrol me in your loyalty scheme and tell me how many points I have collected so far."
    expect_no_tool: true
    notes: >
      No loyalty or rewards capability exists on this surface. Customer-facing
      enough that an account or context tool could plausibly be mistaken for it.
