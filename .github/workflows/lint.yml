name: Lint & unit tests

# Fast, self-contained quality gate (no Shopware install). Intentionally in its
# own workflow with a permanent pull_request trigger so it keeps running on every
# PR regardless of what happens to the heavy eval workflow's triggers.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # ruff is NOT installed bare here any more — requirements-dev.txt pins it.
      # Unpinned, every ruff release landed in CI unreviewed, so a new lint rule
      # could fail this gate without anyone touching the repo.
      - name: Install dev dependencies
        run: |
          pip install -r requirements-dev.txt
          # Editable install so `python -m eval.runner` and the tests can
          # import mcp_client/ownership without a sys.path prelude.
          # --no-deps: the requirements file above is the single source of
          # truth for versions; pyproject.toml declares none.
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      # Static type checking. Gating, like the ruff steps: a renamed key on a
      # TypedDict (FixtureResult is read by five modules) or a bad call now fails
      # here instead of as a KeyError mid-run in the heavy eval workflow. Config,
      # including why it is `standard` and not stricter, lives in pyrightconfig.json.
      - name: Basedpyright (type check)
        run: basedpyright

      - name: Pytest (unit tests)
        # --cov both reports where the gaps are AND gates. No --cov-fail-under is
        # passed here, but `fail_under` in pyproject.toml applies anyway and
        # pytest-cov exits 1 below it, so a dip IS a red build. That is deliberate:
        # the floor lives in one place, so a local `pytest --cov` fails on exactly
        # what CI fails on.
        run: pytest tests -q --cov

      # Static description checks over the committed catalogue snapshot. No
      # server, no model, no tokens — so unlike the eval workflow this runs on
      # every push. Advisory by construction: toollint exits 0 whatever it
      # finds, because the findings are judgements about prose and a build that
      # goes red over word choice is one people learn to bypass.
      #
      # To the log, NOT to this job's summary. eval/summary.py runs the same lint
      # and renders it inside the one consolidated summary, so having it here too
      # meant the same table twice on a labelled PR — and on the run page it sat
      # under "Lint & unit tests", nowhere near the eval numbers it explains.
      # toollint is pure, so running it in both places costs nothing.
      - name: Tool catalogue lint (advisory)
        run: python -m toollint --snapshot tool-history/latest.json

      - name: ShellCheck (shell lint)
        run: |
          shopt -s nullglob globstar
          # Both trees. scripts/ was added later and was silently outside the
          # glob, so the one shell script anybody runs by hand was the one not
          # being linted.
          scripts=(functional/**/*.sh scripts/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts to lint."
          else
            printf 'Linting: %s\n' "${scripts[@]}"
            shellcheck "${scripts[@]}"
          fi

      # The step above covers 116 lines in two files. The shell this repo actually
      # runs is 866 lines across 35 `run:` blocks in .github — the lane setup, the
      # eval gate, the store diagnosis — and none of it was linted, because
      # shellcheck cannot read YAML and widening the glob therefore does nothing.
      #
      # Gating rather than advisory: it was clean when added, so it starts green and
      # can only go red on something new.
      #
      # It IS sensitive to the runner's ShellCheck version, which is worth knowing
      # before someone spends time on a confusing failure: 0.11.0 does not report
      # SC2015 on `[ -d x ] && cp … || true` and the runner's build does, so this
      # step went red on a tree that was clean locally. The findings were real and
      # got fixed; if the runner's version moves again, expect the same shape of
      # surprise — new findings on unchanged shell.
      # Name quoted: an unquoted `run:` inside it reads as a mapping and breaks the
      # file. Caught by this step's own YAML parse, immediately.
      - name: 'ShellCheck (workflow run: blocks)'
        run: python scripts/lint_workflow_shell.py
