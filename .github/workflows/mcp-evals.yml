name: MCP Evals

on:
  # TEMPORARY: remove before merging. Lets the workflow run on PR pushes for testing.
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      shopware_ref:
        description: 'Shopware ref to evaluate against (branch, tag, or sha). Default: contents of shopware.sha (pinned). Cron uses trunk.'
        required: false
        default: ''
      eval_provider:
        description: 'LLM provider for the eval (anthropic | openai)'
        required: false
        default: 'openai'
      eval_model:
        description: 'Override default model for the chosen provider'
        required: false
        default: ''
      dev_tools_ref:
        description: 'SwagMcpDevTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      merchant_tools_ref:
        description: 'SwagMcpMerchantTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      agentic_commerce_ref:
        description: 'shopware/agentic-commerce ref (used when the Store suite runs). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      run_store:
        description: 'Run the Store API / UCP suite. On by default; set false to skip it (saves the agentic-commerce checkout and ~42 LLM fixtures).'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: mcp-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast lint + unit-test gate lives in its own workflow (.github/workflows/lint.yml)
  # so it keeps running on every PR independently of this heavy eval workflow.
  evals:
    name: Run MCP evals
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHOPWARE_REPO: shopware/shopware
      EVAL_PROVIDER: ${{ github.event.inputs.eval_provider || 'openai' }}
      EVAL_MODEL: ${{ github.event.inputs.eval_model || '' }}
      APP_URL: http://localhost:8000
      # Store/UCP suite: on by default, opt OUT with run_store=false.
      # `github.event.inputs` is null on push/schedule, so `!= 'false'` resolves
      # to true there — which is the point. It used to be `== 'true'`, meaning
      # the whole Store suite only ever ran on a manual dispatch that nobody
      # triggered, so its 42 fixtures had never once executed against a server.
      RUN_STORE: ${{ github.event.inputs.run_store != 'false' }}

    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: eval/requirements.txt

      # Resolution priority:
      #   1. workflow_dispatch input  -> manual override
      #   2. schedule (cron)          -> trunk, so we surface upstream drift
      #   3. anything else            -> pinned shopware.sha, so PRs are reproducible
      - name: Determine Shopware ref
        id: ref
        run: |
          set -euo pipefail
          INPUT_REF="${{ github.event.inputs.shopware_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
            SOURCE="workflow_dispatch input"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            REF="trunk"
            SOURCE="cron drift detection"
          else
            if [ ! -f shopware.sha ]; then
              echo "::error::shopware.sha missing (required for PR/push runs)"
              exit 1
            fi
            REF=$(tr -d '[:space:]' < shopware.sha)
            SOURCE="pinned shopware.sha"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using Shopware ref: $REF ($SOURCE)"

      # actions/checkout can't shallow-fetch branches whose name contains a slash
      # because it builds a wildcard refspec that git rejects. Resolving the ref
      # to a SHA via the API first sidesteps the issue entirely.
      - name: Resolve Shopware ref to SHA
        id: sw-sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ env.SHOPWARE_REPO }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # Try branch, then tag. If neither matches, assume REF is already a SHA
          # and let checkout fail loudly downstream instead of guessing.
          for kind in heads tags; do
            SHA=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/refs/${kind}/${REF}" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('object',{}).get('sha',''))" 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              break
            fi
          done
          if [ -z "$SHA" ]; then
            # Bare SHA fallback. Must look like a hex commit id.
            if [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
              SHA="$REF"
            else
              echo "::error::Could not resolve ${REF} in ${REPO} as branch, tag, or SHA"
              exit 1
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REF} -> ${SHA}"

      # Installs PHP, MySQL, composer, clones shopware/shopware @ SHA into ./shopware,
      # and runs system:install. Org-standard primitive used across Shopware repos.
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ steps.sw-sha.outputs.sha }}
          shopware-repository: ${{ env.SHOPWARE_REPO }}
          shopware-github-token: ${{ github.token }}
          path: shopware
          install: true
          env: test
          php-version: '8.3'

      # SwagMcpDevTools and SwagMcpMerchantTools track their repo DEFAULT branch:
      # an empty `ref` makes actions/checkout use it, so we always test the latest
      # plugin code (and survive a default-branch rename) instead of pinning a
      # feature branch. The v2 tool-group/deferral work is merged into both mains.
      # Pass the matching *_ref dispatch input to pin a single run.
      - name: Checkout SwagMcpDevTools (bundle)
        uses: actions/checkout@v7
        with:
          repository: shopware/SwagMcpDevTools
          ref: ${{ github.event.inputs.dev_tools_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/bundles/SwagMcpDevTools
          fetch-depth: 1

      - name: Checkout SwagMcpMerchantTools (plugin)
        uses: actions/checkout@v7
        with:
          repository: shopware/SwagMcpMerchantTools
          ref: ${{ github.event.inputs.merchant_tools_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/plugins/SwagMcpMerchantTools
          fetch-depth: 1

      # The agentic-commerce plugin (composer name shopware/agentic-commerce,
      # plugin class Swag\AgenticCommerce\SwagAgenticCommerce) carries the 14
      # shopware-ucp-* MCP tools under src/Ucp/Mcp/Tool. It pulls the UCP
      # protocol layer in via ucp-php-sdk/symfony-bundle, which is public on
      # Packagist, so composer resolves it without extra wiring. Tracks its
      # default branch like the other plugins.
      - name: Checkout agentic-commerce (Store API / UCP)
        id: agentic_checkout
        if: env.RUN_STORE == 'true'
        # Non-fatal, like the composer step below: this repo is private and
        # PLUGINS_PAT may not be scoped to it (a 'Not Found' from the API means
        # exactly that). An optional plugin the token cannot read must not take
        # down the admin evals. We read steps.*.outcome, not .conclusion, so the
        # real result is still visible to us rather than masked to success.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: shopware/agentic-commerce
          ref: ${{ github.event.inputs.agentic_commerce_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/plugins/SwagAgenticCommerce
          fetch-depth: 1

      - name: Wire up MCP bundle + plugin
        working-directory: shopware
        env:
          STORE_CHECKOUT_OK: ${{ steps.agentic_checkout.outcome == 'success' }}
        run: |
          set -euo pipefail

          # MCP Server v2: the MCP_SERVER feature flag was removed upstream —
          # the server is always enabled, no env gating needed.

          composer config repositories.swag-mcp-dev-tools       path custom/bundles/SwagMcpDevTools
          composer config repositories.swag-mcp-merchant-tools  path custom/plugins/SwagMcpMerchantTools
          composer require \
            swag/mcp-dev-tools:@dev \
            swag/mcp-merchant-tools:@dev \
            --no-interaction --no-scripts

          # Store API / UCP tools. ucp-php-sdk is public on Packagist, so composer
          # resolves the protocol layer without extra wiring.
          #
          # Non-fatal on purpose: this is an optional private plugin, and a
          # credential or resolution problem with it must not take down the admin
          # evals, which are the main signal. It is recorded and warned about
          # rather than swallowed — a silent skip is exactly how these 42 fixtures
          # went unrun for so long.
          STORE_PLUGIN_OK=false
          STORE_SKIP_REASON=""
          if [ "${RUN_STORE}" != "true" ]; then
            STORE_SKIP_REASON="run_store=false"
          elif [ "${STORE_CHECKOUT_OK}" != "true" ]; then
            STORE_SKIP_REASON="the \`shopware/agentic-commerce\` checkout failed — \`PLUGINS_PAT\` is most likely not scoped to that repository (the API answers \`Not Found\`). Grant the token access to it."
          else
            composer config repositories.swag-agentic-commerce path custom/plugins/SwagAgenticCommerce
            if composer require shopware/agentic-commerce:@dev --no-interaction --no-scripts; then
              STORE_PLUGIN_OK=true
            else
              STORE_SKIP_REASON="\`composer require shopware/agentic-commerce\` failed against this Shopware ref — see the step log for the resolver output."
            fi
          fi

          if [ "${STORE_PLUGIN_OK}" != "true" ] && [ "${RUN_STORE}" = "true" ]; then
            echo "::warning::Store/UCP suite skipped: ${STORE_SKIP_REASON}"
            {
              echo "### Store/UCP suite skipped"
              echo ""
              echo "The 42 store fixtures did not run. Reason: ${STORE_SKIP_REASON}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "STORE_PLUGIN_OK=${STORE_PLUGIN_OK}" >> "$GITHUB_ENV"

          bin/console plugin:refresh --no-interaction
          bin/console plugin:install --activate SwagMcpMerchantTools --no-interaction
          if [ "${STORE_PLUGIN_OK}" = "true" ]; then
            bin/console plugin:install --activate SwagAgenticCommerce --no-interaction
          fi
          bin/console cache:clear --no-interaction
          bin/console cache:warmup --no-interaction

          # The MCP controller must exist in the compiled container — hard fail if not.
          bin/console debug:container "Shopware\Core\Framework\Mcp\Controller\McpServerController" 2>&1 \
            | grep -E 'Public|private|class' | head -5 \
            || { echo "::error::McpServerController not found in compiled container"; exit 1; }

          # Restart the daemonized symfony web server so PHP-FPM workers reload
          # the freshly compiled container (otherwise opcache serves stale bytecode).
          symfony server:stop 2>/dev/null || true
          SYMFONY_DAEMON=1 SYMFONY_NO_TLS=1 SYMFONY_ALLOW_HTTP=1 SYMFONY_PORT=8000 SYMFONY_ALLOW_ALL_IP=1 \
            symfony server:start

      - name: Wait for Shopware after plugin install
        run: |
          # A 2xx or 401 both prove the server is up (401 = auth middleware
          # answering, which is what the OAuth/integration step needs next).
          bash "$GITHUB_WORKSPACE/functional/ci/wait_for_http.sh" \
            http://localhost:8000/api/_info/version 60 2 || {
              echo "--- symfony server:status ---"
              (cd shopware && symfony server:status 2>&1) || true
              exit 1
            }

      # A fresh system:install has no products/customers/orders, so the
      # data-dependent functional assertions (entity-read/upsert, order-state,
      # order-summary, customer-lookup, cart flows) would SKIP. Seed demo data
      # so they actually run. Non-fatal: if seeding fails, those assertions just
      # skip as before — it must never turn the whole eval red.
      - name: Seed demo data
        working-directory: shopware
        continue-on-error: true
        run: |
          # framework:demodata refuses to run under APP_ENV=test, so seed in
          # prod. The database (DATABASE_URL) is shared across envs, so the
          # test-env MCP server reads the seeded products/customers/orders.
          APP_ENV=prod bin/console framework:demodata \
            --products=20 --categories=5 --manufacturers=5 \
            --customers=10 --orders=10 --media=10 \
            --no-interaction || echo "::warning::framework:demodata failed; data-dependent assertions will skip"
          APP_ENV=prod bin/console dal:refresh:index --no-interaction || true

      - name: Create integration
        id: integration
        run: |
          set -euo pipefail

          ACCESS_KEY="SWIA$(openssl rand -hex 12 | tr 'a-f' 'A-F')"
          SECRET_KEY="$(openssl rand -hex 32)"

          TOKEN=$(curl -fsS -X POST "${APP_URL}/api/oauth/token" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"password","client_id":"administration","scope":"write","username":"admin","password":"shopware"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')

          curl -fsS -X POST "${APP_URL}/api/integration" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"label\":\"mcp-evals\",\"accessKey\":\"${ACCESS_KEY}\",\"secretAccessKey\":\"${SECRET_KEY}\",\"admin\":true,\"writeAccess\":true}" \
            > /dev/null

          echo "::add-mask::${SECRET_KEY}"
          {
            echo "access_key=${ACCESS_KEY}"
            echo "secret_key=${SECRET_KEY}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python deps
        run: pip install -r eval/requirements.txt

      - name: Snapshot MCP tool descriptions
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: |
          mkdir -p tool-history
          python eval/snapshot_tools.py --output tool-history/latest.json
          cp tool-history/latest.json "tool-history/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"

      # If the snapshot differs from the committed baseline, descriptions have
      # drifted upstream and the eval expectations may need updating. Treat the
      # LLM eval as advisory in that case so PR/main runs stay green until a
      # reconciliation PR bumps shopware.sha + baseline + expectations together.
      - name: Detect tool description drift
        id: drift
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch tool-history/latest.json > /dev/null 2>&1; then
            if git diff --quiet -- tool-history/latest.json; then
              echo "drift=false" >> "$GITHUB_OUTPUT"
              echo "No description drift vs committed baseline."
            else
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Tool description drift detected vs committed baseline."
              {
                echo "## Tool description drift detected"
                echo ""
                echo "Shopware ref: \`${{ steps.ref.outputs.ref }}\` → \`${{ steps.sw-sha.outputs.sha }}\`"
                echo ""
                echo "LLM eval failures will be advisory (non-blocking) for this run."
                echo "Reconcile by opening a PR that updates \`shopware.sha\`, \`tool-history/latest.json\`, and any affected eval expectations."
                echo ""
                echo '```diff'
                git diff -- tool-history/latest.json | head -200
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No committed baseline (tool-history/latest.json); treating as drift."
          fi

      - name: Run functional tests
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: python functional/run.py --endpoint admin

      - name: Run LLM eval
        id: eval
        continue-on-error: ${{ steps.drift.outputs.drift == 'true' }}
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")
          # Fixed path so the cross-model comparison step can find it.
          python eval/run.py "${args[@]}" --output "results/eval-primary.json"

      # Second opinion on the same fixtures: a fixture both models miss points at
      # the tool description, while one both pass is noise.
      #
      # This deliberately does NOT use GitHub Models. That was tried (free, and
      # would have given cross-provider signal via Mistral) and its free tier
      # cannot carry this volume: 45 fixtures x 2 modes throttled every single
      # fixture, answering HTTP 403 "Too many requests" rather than 429. Lowering
      # concurrency would not fix a per-day quota. `--provider github` still works
      # for small local runs; it is just not viable for a full CI sweep.
      #
      # gpt-4o-mini runs on the existing project key. Same vendor as the primary
      # eval, so this checks "is the description clear enough for a weaker model"
      # rather than cross-provider behaviour — the weaker of the two signals, but
      # one that actually completes.
      - name: Run LLM eval (second validator)
        id: eval_second
        # Run whenever the primary eval actually ran — it gates, so it fails
        # exactly when a second opinion is most useful, and skipping this on its
        # failure threw away the both-models-failed signal.
        #
        # But `always()` alone was too broad: when setup died early the primary
        # was *skipped*, and this still fired into a runner with no dependencies
        # installed and died on `No module named 'yaml'`, turning one real
        # failure into two. Requiring the primary to have run keeps the trigger
        # tied to a usable environment.
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        # No continue-on-error: this model gates at the same 90% as the primary.
        # It measured 91% on the 90-fixture set, so the bar is one it has
        # actually cleared, not an aspiration. continue-on-error would also
        # report a failed step as successful, which has misled us once already.
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python eval/run.py --provider openai --model gpt-4o-mini \
            --output "results/eval-second-validator.json"

      # Reduce both runs to the split that matters: a fixture BOTH models miss
      # is a tool-description problem, one only the weaker model misses is its
      # capability gap. Emits a per-tool work list to the job summary.
      #
      # --gate both enforces 90% for BOTH models. Each eval step also gates
      # itself, so this is the consolidated verdict rather than the only one —
      # it exists so the policy is declared in one visible place and so the two
      # rates are compared on identical terms (both computed over fixtures that
      # actually ran, errors excluded and budgeted separately).
      - name: Compare models
        id: eval_compare
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          primary="results/eval-primary.json"
          second="results/eval-second-validator.json"
          # Deliberately not `continue-on-error`: that reports a failed step as
          # successful, which already bit us once. Skip explicitly instead, so
          # the exit code stays meaningful when --gate is turned on.
          if [ ! -f "${primary}" ] || [ ! -f "${second}" ]; then
            echo "Skipping cross-model comparison: a report is missing (one of the eval steps did not finish)." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python eval/compare_runs.py "${primary}" "${second}" \
            --min-pass-rate 0.9 \
            --gate both \
            --output "results/eval-comparison.json"

      # -------------------------------------------------------------------
      # Store API / UCP suite — runs by default; skip with run_store=false.
      # -------------------------------------------------------------------
      - name: Fetch sales-channel access key
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        id: sc
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "${APP_URL}/api/oauth/token" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"password","client_id":"administration","scope":"write","username":"admin","password":"shopware"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          SC_KEY=$(curl -fsS "${APP_URL}/api/sales-channel?limit=50" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((sc.get('attributes',sc).get('accessKey') for sc in d.get('data',[]) if sc.get('attributes',sc).get('accessKey')),''))")
          echo "::add-mask::${SC_KEY}"
          echo "sc_access_key=${SC_KEY}" >> "$GITHUB_OUTPUT"

      - name: Run Store API functional tests
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.sc.outputs.sc_access_key }}
        run: python functional/run.py --endpoint store

      - name: Run Store API LLM eval (advisory)
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        continue-on-error: true
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.sc.outputs.sc_access_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")
          python eval/run.py --endpoint store --modes discovery "${args[@]}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tool-history snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-history-${{ github.run_id }}
          path: tool-history/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump symfony server logs on failure
        if: failure()
        run: |
          LOG_DIR="$HOME/.config/symfony-cli/log"
          if [ ! -d "$LOG_DIR" ]; then
            echo "No symfony log dir at $LOG_DIR"
            exit 0
          fi
          # tail (not follow) every log file under the symfony-cli log dir
          for f in "$LOG_DIR"/*.log "$LOG_DIR"/*/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 200 lines) ==="
            tail -n 200 "$f" || true
          done
          # Also dump Shopware's own var/log if present
          SW_LOG="${{ github.workspace }}/shopware/var/log"
          if [ -d "$SW_LOG" ]; then
            for f in "$SW_LOG"/*.log; do
              [ -f "$f" ] || continue
              echo "=== $f (last 200 lines) ==="
              tail -n 200 "$f" || true
            done
          fi

      - name: Stop Shopware
        if: always()
        working-directory: shopware
        run: symfony server:stop 2>/dev/null || true
