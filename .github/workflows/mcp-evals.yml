name: MCP Evals

on:
  # Opt-in per PR, via the `run-evals` label. Not every PR: a run installs
  # Shopware, spends real OpenAI credit, and takes minutes, while most changes
  # here are fixtures, scoring or docs that lint.yml already covers. The job is
  # gated on the label (see `if:` below), so an unlabelled PR costs nothing.
  #
  # `labeled` starts a run the moment the label goes on; `synchronize` re-runs it
  # on later pushes for as long as the label stays. Remove the label to stop.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      shopware_ref:
        description: 'Shopware ref to evaluate against (branch, tag, or sha). Default: contents of shopware.sha (pinned). Cron uses trunk.'
        required: false
        default: ''
      # A dropdown, not free text, and openai is the only option because it is the
      # only provider with a key: the repo secrets are OPENAI_API_KEY and
      # PLUGINS_PAT. Typing `anthropic` here used to be accepted, then failed ~140s
      # in on an empty ANTHROPIC_API_KEY, after the whole Shopware install.
      #
      # To enable Anthropic: add the ANTHROPIC_API_KEY secret and add 'anthropic'
      # back to the options below. The runner already supports it (`--provider
      # anthropic`), and the step still passes the secret through, so nothing else
      # needs changing.
      eval_provider:
        description: 'LLM provider for the eval'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
      eval_model:
        description: 'Override the default model for the chosen provider (e.g. gpt-4o-mini). Affects the primary arm only; the second validator is pinned to gpt-4o-mini.'
        required: false
        default: ''
      dev_tools_ref:
        description: 'SwagMcpDevTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      merchant_tools_ref:
        description: 'SwagMcpMerchantTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      agentic_commerce_ref:
        description: 'shopware/agentic-commerce ref (used when the Store suite runs). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      run_store:
        description: 'Run the Store API / UCP suite. On by default; set false to skip it (saves the agentic-commerce checkout and ~42 LLM fixtures).'
        required: false
        default: 'true'

permissions:
  contents: write
  # The nightly reconciliation PR needs this; contents: write alone can push a
  # branch but not open a pull request for it.
  pull-requests: write

concurrency:
  group: mcp-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast lint + unit-test gate lives in its own workflow (.github/workflows/lint.yml)
  # so it keeps running on every PR independently of this heavy eval workflow.
  evals:
    name: Run MCP evals
    # On a PR this needs the `run-evals` label; schedule and workflow_dispatch are
    # unconditional. The gate is on the job rather than in the `on:` block because
    # GitHub cannot filter a trigger by label — so the workflow starts and the job
    # skips, which costs nothing and leaves a visible "skipped" instead of silence.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-evals') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHOPWARE_REPO: shopware/shopware
      EVAL_PROVIDER: ${{ github.event.inputs.eval_provider || 'openai' }}
      EVAL_MODEL: ${{ github.event.inputs.eval_model || '' }}
      APP_URL: http://localhost:8000
      # TEMPORARY. `passed` changed meaning: the chosen tool is now executed and
      # its result asserted, and a wrong first pick may be recovered from. The
      # 0.90/0.85 thresholds were calibrated against first-tool-correct, so they
      # no longer describe the same quantity — assertions push the rate down,
      # recovery pushes it up, and the net is unknown until it has been measured.
      #
      # While this is true both admin gates warn instead of failing. Read
      # `first_try_rate` and `recovery_rate` from a nightly, set the thresholds
      # from those numbers, then delete this and the two branches that read it.
      REBASELINE: 'true'
      # The eval is the bulk of the wall clock: ~425s of summed fixture latency per
      # model, which at the old 4-way concurrency was ~106s of a 155s step. It sat
      # at 4 because the MCP endpoint answered 429 above that, and the step below
      # now disables the MCP rate limiter on the throwaway instance, which removes
      # that ceiling. Measured effect: the two eval steps went 314s -> ~150-170s.
      #
      # 12 is deliberately short of the theoretical floor. sum_latency/12 is ~35s
      # against a slowest-single-fixture bound of ~14s, so there is still headroom,
      # and the next ceilings (the OpenAI account's own limits and one PHP-FPM
      # worker pool) are not measured yet. The runner reads this as the default for
      # --discovery-concurrency, so it applies to the admin and store suites alike.
      EVAL_DISCOVERY_CONCURRENCY: '12'
      # Store/UCP suite: on by default, opt OUT with run_store=false.
      # `github.event.inputs` is null on push/schedule, so `!= 'false'` resolves
      # to true there — which is the point. It used to be `== 'true'`, meaning
      # the whole Store suite only ever ran on a manual dispatch that nobody
      # triggered, so its 42 fixtures had never once executed against a server.
      RUN_STORE: ${{ github.event.inputs.run_store != 'false' }}

    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: eval/requirements.txt

      # Resolution priority:
      #   1. workflow_dispatch input  -> manual override
      #   2. schedule (cron)          -> trunk, so we surface upstream drift
      #   3. anything else            -> pinned shopware.sha, so PRs are reproducible
      - name: Determine Shopware ref
        id: ref
        run: |
          set -euo pipefail
          INPUT_REF="${{ github.event.inputs.shopware_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
            SOURCE="workflow_dispatch input"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            REF="trunk"
            SOURCE="cron drift detection"
          else
            if [ ! -f shopware.sha ]; then
              echo "::error::shopware.sha missing (required for PR/push runs)"
              exit 1
            fi
            REF=$(tr -d '[:space:]' < shopware.sha)
            SOURCE="pinned shopware.sha"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using Shopware ref: $REF ($SOURCE)"

      # actions/checkout can't shallow-fetch branches whose name contains a slash
      # because it builds a wildcard refspec that git rejects. Resolving the ref
      # to a SHA via the API first sidesteps the issue entirely.
      - name: Resolve Shopware ref to SHA
        id: sw-sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ env.SHOPWARE_REPO }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # Try branch, then tag. If neither matches, assume REF is already a SHA
          # and let checkout fail loudly downstream instead of guessing.
          for kind in heads tags; do
            SHA=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/refs/${kind}/${REF}" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('object',{}).get('sha',''))" 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              break
            fi
          done
          if [ -z "$SHA" ]; then
            # Bare SHA fallback. Must look like a hex commit id.
            if [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
              SHA="$REF"
            else
              echo "::error::Could not resolve ${REF} in ${REPO} as branch, tag, or SHA"
              exit 1
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REF} -> ${SHA}"

      # Installs PHP, MySQL, composer, clones shopware/shopware @ SHA into ./shopware,
      # and runs system:install. Org-standard primitive used across Shopware repos.
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ steps.sw-sha.outputs.sha }}
          shopware-repository: ${{ env.SHOPWARE_REPO }}
          shopware-github-token: ${{ github.token }}
          path: shopware
          install: true
          env: test
          php-version: '8.3'

      # SwagMcpDevTools and SwagMcpMerchantTools track their repo DEFAULT branch:
      # an empty `ref` makes actions/checkout use it, so we always test the latest
      # plugin code (and survive a default-branch rename) instead of pinning a
      # feature branch. The v2 tool-group/deferral work is merged into both mains.
      # Pass the matching *_ref dispatch input to pin a single run.
      - name: Checkout SwagMcpDevTools (bundle)
        uses: actions/checkout@v7
        with:
          repository: shopware/SwagMcpDevTools
          ref: ${{ github.event.inputs.dev_tools_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/bundles/SwagMcpDevTools
          fetch-depth: 1

      - name: Checkout SwagMcpMerchantTools (plugin)
        uses: actions/checkout@v7
        with:
          repository: shopware/SwagMcpMerchantTools
          ref: ${{ github.event.inputs.merchant_tools_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/plugins/SwagMcpMerchantTools
          fetch-depth: 1

      # The agentic-commerce plugin (composer name shopware/agentic-commerce,
      # plugin class Swag\AgenticCommerce\SwagAgenticCommerce) carries the 14
      # shopware-ucp-* MCP tools under src/Ucp/Mcp/Tool. It pulls the UCP
      # protocol layer in via ucp-php-sdk/symfony-bundle, which is public on
      # Packagist, so composer resolves it without extra wiring. Tracks its
      # default branch like the other plugins.
      - name: Checkout agentic-commerce (Store API / UCP)
        id: agentic_checkout
        if: env.RUN_STORE == 'true'
        # Non-fatal, like the composer step below: this repo is private and
        # PLUGINS_PAT may not be scoped to it (a 'Not Found' from the API means
        # exactly that). An optional plugin the token cannot read must not take
        # down the admin evals. We read steps.*.outcome, not .conclusion, so the
        # real result is still visible to us rather than masked to success.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: shopware/agentic-commerce
          ref: ${{ github.event.inputs.agentic_commerce_ref }}
          token: ${{ secrets.PLUGINS_PAT }}
          path: shopware/custom/plugins/SwagAgenticCommerce
          fetch-depth: 1

      - name: Wire up MCP bundle + plugin
        working-directory: shopware
        env:
          STORE_CHECKOUT_OK: ${{ steps.agentic_checkout.outcome == 'success' }}
        run: |
          set -euo pipefail

          # MCP Server v2: the MCP_SERVER feature flag was removed upstream —
          # the server is always enabled, no env gating needed.

          composer config repositories.swag-mcp-dev-tools       path custom/bundles/SwagMcpDevTools
          composer config repositories.swag-mcp-merchant-tools  path custom/plugins/SwagMcpMerchantTools
          composer require \
            swag/mcp-dev-tools:@dev \
            swag/mcp-merchant-tools:@dev \
            --no-interaction --no-scripts

          # Store API / UCP tools. ucp-php-sdk is public on Packagist, so composer
          # resolves the protocol layer without extra wiring.
          #
          # Non-fatal on purpose: this is an optional private plugin, and a
          # credential or resolution problem with it must not take down the admin
          # evals, which are the main signal. It is recorded and warned about
          # rather than swallowed — a silent skip is exactly how these 42 fixtures
          # went unrun for so long.
          STORE_PLUGIN_OK=false
          STORE_SKIP_REASON=""
          if [ "${RUN_STORE}" != "true" ]; then
            STORE_SKIP_REASON="run_store=false"
          elif [ "${STORE_CHECKOUT_OK}" != "true" ]; then
            STORE_SKIP_REASON="the \`shopware/agentic-commerce\` checkout failed — \`PLUGINS_PAT\` is most likely not scoped to that repository (the API answers \`Not Found\`). Grant the token access to it."
          else
            composer config repositories.swag-agentic-commerce path custom/plugins/SwagAgenticCommerce
            if composer require shopware/agentic-commerce:@dev --no-interaction --no-scripts; then
              STORE_PLUGIN_OK=true
            else
              STORE_SKIP_REASON="\`composer require shopware/agentic-commerce\` failed against this Shopware ref — see the step log for the resolver output."
            fi
          fi

          if [ "${STORE_PLUGIN_OK}" != "true" ] && [ "${RUN_STORE}" = "true" ]; then
            echo "::warning::Store/UCP suite skipped: ${STORE_SKIP_REASON}"
            {
              echo "### Store/UCP suite skipped"
              echo ""
              echo "The 42 store fixtures did not run. Reason: ${STORE_SKIP_REASON}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "STORE_PLUGIN_OK=${STORE_PLUGIN_OK}" >> "$GITHUB_ENV"

          bin/console plugin:refresh --no-interaction
          bin/console plugin:install --activate SwagMcpMerchantTools --no-interaction
          if [ "${STORE_PLUGIN_OK}" = "true" ]; then
            bin/console plugin:install --activate SwagAgenticCommerce --no-interaction
          fi

          # Turn the MCP rate limiter off on this throwaway instance.
          #
          # It was the wall-clock ceiling and nothing said so. Shopware's test env
          # overrides only `login` and `login_user`, so CI inherited the PRODUCTION
          # mcp_admin_api limits (300/60s, 1000/10min) - and each eval step already
          # issues roughly 650 MCP requests in ~155s, about 250 req/min, some 85% of
          # the per-minute cap. That is why --discovery-concurrency sat at 4: the
          # comment on the flag says higher throttles with HTTP 429. Making the run
          # faster does not reduce the request count, it compresses it into a
          # shorter window, which is precisely what a per-minute limiter punishes,
          # so no amount of parallelism could help while this was on.
          #
          # Throttling is not what these fixtures measure (they measure tool
          # selection) and the instance dies with the job. The cost is stated
          # plainly: CI no longer exercises MCP throttling, so a regression in the
          # limiter itself has to be caught by tests/integration in
          # shopware/shopware, not here.
          #
          # Project + env-specific config is the highest-precedence layer, so this
          # beats the bundle defaults. It has to land BEFORE the cache:clear below,
          # and the directory must stay the env the web server actually serves
          # (test, set by setup-shopware) or the override silently stops applying
          # and the run silently goes back to being throttled.
          mkdir -p config/packages/test
          cat > config/packages/test/z-eval-no-mcp-rate-limit.yaml <<'YAML'
          shopware:
              api:
                  rate_limiter:
                      mcp_admin_api:
                          enabled: false
                      mcp_store_api:
                          enabled: false
          YAML

          bin/console cache:clear --no-interaction
          bin/console cache:warmup --no-interaction

          # The MCP controller must exist in the compiled container — hard fail if not.
          bin/console debug:container "Shopware\Core\Framework\Mcp\Controller\McpServerController" 2>&1 \
            | grep -E 'Public|private|class' | head -5 \
            || { echo "::error::McpServerController not found in compiled container"; exit 1; }

          # Restart the daemonized symfony web server so PHP-FPM workers reload
          # the freshly compiled container (otherwise opcache serves stale bytecode).
          symfony server:stop 2>/dev/null || true
          SYMFONY_DAEMON=1 SYMFONY_NO_TLS=1 SYMFONY_ALLOW_HTTP=1 SYMFONY_PORT=8000 SYMFONY_ALLOW_ALL_IP=1 \
            symfony server:start

      - name: Wait for Shopware after plugin install
        run: |
          # A 2xx or 401 both prove the server is up (401 = auth middleware
          # answering, which is what the OAuth/integration step needs next).
          bash "$GITHUB_WORKSPACE/functional/ci/wait_for_http.sh" \
            http://localhost:8000/api/_info/version 60 2 || {
              echo "--- symfony server:status ---"
              (cd shopware && symfony server:status 2>&1) || true
              exit 1
            }

      # A fresh system:install has no products/customers/orders, so the
      # data-dependent functional assertions (entity-read/upsert, order-state,
      # order-summary, customer-lookup, cart flows) would SKIP. Seed demo data
      # so they actually run. Non-fatal: if seeding fails, those assertions just
      # skip as before — it must never turn the whole eval red.
      - name: Seed demo data
        working-directory: shopware
        continue-on-error: true
        run: |
          # framework:demodata refuses to run under APP_ENV=test, so seed in
          # prod. The database (DATABASE_URL) is shared across envs, so the
          # test-env MCP server reads the seeded products/customers/orders.
          APP_ENV=prod bin/console framework:demodata \
            --products=20 --categories=5 --manufacturers=5 \
            --customers=10 --orders=10 --media=10 \
            --no-interaction || echo "::warning::framework:demodata failed; data-dependent assertions will skip"
          APP_ENV=prod bin/console dal:refresh:index --no-interaction || true

      - name: Create integration
        id: integration
        run: |
          set -euo pipefail

          ACCESS_KEY="SWIA$(openssl rand -hex 12 | tr 'a-f' 'A-F')"
          SECRET_KEY="$(openssl rand -hex 32)"

          TOKEN=$(curl -fsS -X POST "${APP_URL}/api/oauth/token" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"password","client_id":"administration","scope":"write","username":"admin","password":"shopware"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')

          curl -fsS -X POST "${APP_URL}/api/integration" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"label\":\"mcp-evals\",\"accessKey\":\"${ACCESS_KEY}\",\"secretAccessKey\":\"${SECRET_KEY}\",\"admin\":true,\"writeAccess\":true}" \
            > /dev/null

          echo "::add-mask::${SECRET_KEY}"
          {
            echo "access_key=${ACCESS_KEY}"
            echo "secret_key=${SECRET_KEY}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python deps
        run: |
          pip install -r eval/requirements.txt
          # Editable install so `python -m eval.runner` and the tests can
          # import mcp_client/ownership without a sys.path prelude.
          # --no-deps: the requirements file above is the single source of
          # truth for versions; pyproject.toml declares none.
          pip install -e . --no-deps

      # The previous run's report, for the cost comparison at the end. A cache
      # rather than an artifact download: restore-keys falls back to the most
      # recent entry with this prefix, so there is no API call and no run-id
      # bookkeeping. On a first run, or when the cache has expired, nothing is
      # restored and cost_drift says it has nothing to compare against.
      #
      # Cache scoping does something useful for free here: a PR branch can read
      # main's cache but writes to its own, so a PR is measured against main's
      # last nightly and cannot poison the baseline for anyone else.
      - name: Restore previous cost baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: eval-cost-baseline-${{ github.run_id }}
          restore-keys: eval-cost-baseline-

      - name: Snapshot MCP tool descriptions
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: |
          mkdir -p tool-history
          python -m eval.snapshot_tools --output tool-history/latest.json
          cp tool-history/latest.json "tool-history/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"

      # If the snapshot differs from the committed baseline, descriptions have
      # drifted upstream and the eval expectations may need updating. Treat the
      # LLM eval as advisory in that case so PR/main runs stay green until a
      # reconciliation PR bumps shopware.sha + baseline + expectations together.
      - name: Detect tool description drift
        id: drift
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch tool-history/latest.json > /dev/null 2>&1; then
            if git diff --quiet -- tool-history/latest.json; then
              echo "drift=false" >> "$GITHUB_OUTPUT"
              echo "No description drift vs committed baseline."
            else
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Tool description drift detected vs committed baseline."
              # `eval.drift` names what moved. The raw diff stays below it, folded,
              # because 200 lines of JSON is evidence rather than a finding — a
              # reader needs "these 11 descriptions changed" first.
              git show HEAD:tool-history/latest.json > /tmp/baseline.json
              {
                python -m eval.drift --old /tmp/baseline.json --new tool-history/latest.json \
                  --heading "Tool description drift detected"
                echo ""
                echo "Shopware ref: \`${{ steps.ref.outputs.ref }}\` → \`${{ steps.sw-sha.outputs.sha }}\`"
                echo ""
                echo "LLM eval failures will be advisory (non-blocking) for this run."
                echo ""
                echo "<details><summary>Raw snapshot diff</summary>"
                echo ""
                echo '```diff'
                git diff -- tool-history/latest.json | head -200
                echo '```'
                echo ""
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No committed baseline (tool-history/latest.json); treating as drift."
          fi

      # Only the nightly cron opens this. A cron run resolves the ref to trunk, so
      # its drift IS the upstream movement someone has to reconcile — and printing
      # instructions into a job summary nobody is watching at 06:00 is how the
      # baseline went eleven descriptions stale without anyone noticing.
      #
      # Dispatch and push runs are excluded on purpose: they resolve to the pinned
      # sha, so their "drift" is usually a deliberate local change under test, and
      # a PR for it would be noise.
      #
      # Deliberately NOT part of the gate: this is a convenience, so every failure
      # mode here is swallowed rather than allowed to fail a run whose eval passed.
      - name: Open a reconciliation PR (nightly only)
        if: github.event_name == 'schedule' && steps.drift.outputs.drift == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SW_SHA: ${{ steps.sw-sha.outputs.sha }}
        run: |
          set -euo pipefail
          # One branch per upstream sha: a second nightly on the same trunk commit
          # updates the existing PR instead of opening another.
          BRANCH="chore/reconcile-mcp-drift-${SW_SHA:0:12}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          echo "$SW_SHA" > shopware.sha
          git add shopware.sha tool-history/latest.json

          if git diff --cached --quiet; then
            echo "Nothing to reconcile after all — no commit, no PR."
            exit 0
          fi

          git show "origin/${GITHUB_REF_NAME}:tool-history/latest.json" > /tmp/baseline.json 2>/dev/null || true
          python -m eval.drift --old /tmp/baseline.json --new tool-history/latest.json \
            --heading "What moved upstream" > /tmp/body.md

          {
            echo ""
            echo "Opened automatically by the nightly eval run against \`trunk\`."
            echo "Bumps \`shopware.sha\` to \`$SW_SHA\` and refreshes the catalogue baseline together,"
            echo "so the next run can attribute its own diff instead of re-reporting this one."
            echo ""
            echo "**Check before merging:** a tool added here needs fixtures, and a tool removed"
            echo "means its fixtures will start skipping. Descriptions changing is the ordinary case."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> /tmp/body.md

          git commit -q -m "chore(tool-history): reconcile baseline with trunk ${SW_SHA:0:12}" \
                        -m "Opened by the nightly eval run. See the PR body for what moved."
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json number --jq .number > /dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file /tmp/body.md
            echo "Updated the existing reconciliation PR for $BRANCH."
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
              --title "chore(tool-history): reconcile baseline with trunk ${SW_SHA:0:12}" \
              --body-file /tmp/body.md
          fi

      - name: Run functional tests
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: python -m functional.runner --endpoint admin

      # Why gpt-4o-mini as the second opinion, and why 85%
      #
      # A fixture both models miss points at the tool description; one only the
      # weaker model misses is its own capability gap. That split is the reason a
      # second model runs at all.
      #
      # It deliberately does NOT use GitHub Models. That was tried (free, and would
      # have given cross-provider signal via Mistral) and its free tier cannot carry
      # this volume: at 45 fixtures it throttled every single one, answering HTTP 403
      # "Too many requests" rather than 429. Lowering concurrency does not fix a
      # per-day quota. `--provider github` still works for small local runs.
      #
      # gpt-4o-mini runs on the existing project key. Same vendor as the primary but
      # no longer the same model family: the primary moved from gpt-4o to gpt-5.4-mini
      # precisely because gpt-4o and gpt-4o-mini shared a generation and
      # function-calling stack, so they failed for the same reasons and agreeing told
      # us little. Across two generations a both-fail is evidence about the
      # description rather than one family's quirk. Still not cross-VENDOR, which
      # needs a second API key.
      #
      # 85%, not the primary's 90%: it measured 91% on the 90-fixture set, so 90% was
      # a bar it had cleared, but only just, and it flapped there — 89% on one commit
      # and 90% on the next with no change to descriptions or fixtures in between,
      # and later a run failed on 88% core while the primary was clean at 21/21
      # dev-tools. 85% still catches a collapse, which is what the gate is for.
      # Re-measure before swapping the model.

      # Reduce both runs to the split that matters: a fixture BOTH models miss
      # is a tool-description problem, one only the weaker model misses is its
      # capability gap. Emits a per-tool work list to the job summary.
      #
      # --gate both enforces 90% for the primary and 85% for the second validator,
      # matching what each eval step gates itself at. This is the consolidated
      # verdict rather than the only one —
      # it exists so the policy is declared in one visible place and so the two
      # rates are compared on identical terms (both computed over fixtures that
      # actually ran, errors excluded and budgeted separately).
      #
      # Both admin models run CONCURRENTLY in this one step, because they are
      # independent: separate MCP sessions, separate report files, separate summary
      # rows. Sequentially they were 155s + 159s of a 481s job; overlapped, the pair
      # costs the slower of the two.
      #
      # One step rather than two parallel jobs: a second job would repeat the whole
      # ~140s setup (install Shopware, wire up the bundle, seed data) and then need
      # the reports shuttled between jobs as artifacts for the comparison step.
      #
      # The two gate differently, which is the whole reason this is not a plain
      # `&`-and-forget. Their exit codes are captured separately and applied
      # separately at the bottom:
      #   primary  90%, but ADVISORY when the catalogue has drifted from the
      #            committed baseline (what used to be continue-on-error on this
      #            step) — the descriptions under test are then not the ones the
      #            baseline recorded, so its verdict is not attributable.
      #   second   85%, always gating.
      #
      # Output is captured per model and replayed in order afterwards. Two runners
      # writing to the same stdout interleave line by line, and these logs are how
      # a failure gets diagnosed.
      - name: Run LLM evals (primary + second validator, in parallel)
        id: eval
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
          DRIFTED: ${{ steps.drift.outputs.drift }}
        # No `set -e`: the exit codes are the result here, so the script must
        # outlive a failing runner rather than abort on the first one.
        run: |
          set -uo pipefail
          mkdir -p results/rows

          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")

          # Fixed output paths so the cross-model comparison step can find them.
          # --summary-row feeds the consolidated job summary rendered at the end of
          # the job; the numeric prefix fixes each row's position in its table.
          # Nightly only: after the discovery pass, re-run ONLY its failures
          # with the fixture's own toolset enabled, then with the whole
          # catalogue enabled. That separates three problems which look
          # identical in the gating arm — a bad description, a collision with
          # another group, or a discovery layer that never surfaced the tool.
          #
          # In the same invocation on purpose. A separate step would re-run the
          # whole discovery pass first just to learn what failed, doubling the
          # primary cost; here the failures are already in memory, so triage is
          # ~18 extra fixture runs (~$0.10) rather than ~96.
          [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] && args+=(--triage)

          python -m eval.runner "${args[@]}" \
            --output "results/eval-primary.json" \
            --summary-row "results/rows/1-admin-primary.json" \
            --suite-label "admin · primary" > primary.log 2>&1 &
          pid_primary=$!

          # gpt-4o-mini is pinned: it is the fixed second opinion, not a
          # dispatch-overridable arm, so it ignores EVAL_PROVIDER/EVAL_MODEL.
          # EVAL_MIN_PASS_RATE applies to its overall AND core gates, because
          # min_core_pass_rate defaults to min_pass_rate — and it was the core gate
          # at 88% that once failed a run whose primary was clean.
          EVAL_MIN_PASS_RATE=0.85 python -m eval.runner --provider openai --model gpt-4o-mini \
            --output "results/eval-second-validator.json" \
            --summary-row "results/rows/2-admin-second.json" \
            --suite-label "admin · second validator" > second.log 2>&1 &
          pid_second=$!

          # `|| rc=$?`, not `wait; rc=$?`. GitHub runs this with `bash -e`, which
          # the script's own `set -uo pipefail` does not undo, and a failing
          # `wait` is a simple command — so the shell exited *at the wait* the
          # first time a runner returned non-zero. Everything below never ran:
          # no `cat primary.log`, so the reason was invisible, and none of the
          # advisory handling underneath, so REBASELINE and DRIFTED could not
          # take effect. The step just failed with a bare exit code.
          rc_primary=0; wait "${pid_primary}" || rc_primary=$?
          rc_second=0; wait "${pid_second}" || rc_second=$?

          echo "::group::admin · primary (exit ${rc_primary})"
          cat primary.log
          echo "::endgroup::"
          echo "::group::admin · second validator (exit ${rc_second})"
          cat second.log
          echo "::endgroup::"

          echo "primary_exit=${rc_primary}" >> "$GITHUB_OUTPUT"
          echo "second_exit=${rc_second}" >> "$GITHUB_OUTPUT"

          failed=0
          if [ "${rc_primary}" -ne 0 ]; then
            if [ "${REBASELINE}" = "true" ]; then
              echo "::warning::admin · primary failed (exit ${rc_primary}), advisory during the recovery/assertion re-baselining window."
            elif [ "${DRIFTED}" = "true" ]; then
              echo "::warning::admin · primary failed (exit ${rc_primary}), treated as advisory because the tool catalogue has drifted from the committed baseline."
            else
              echo "::error::admin · primary failed (exit ${rc_primary})."
              failed=1
            fi
          fi
          if [ "${rc_second}" -ne 0 ]; then
            if [ "${REBASELINE}" = "true" ]; then
              echo "::warning::admin · second validator failed (exit ${rc_second}), advisory during the recovery/assertion re-baselining window."
            else
              echo "::error::admin · second validator failed (exit ${rc_second})."
              failed=1
            fi
          fi
          exit "${failed}"

      - name: Compare models
        id: eval_compare
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          primary="results/eval-primary.json"
          second="results/eval-second-validator.json"
          # Deliberately not `continue-on-error`: that reports a failed step as
          # successful, which already bit us once. Skip explicitly instead, so
          # the exit code stays meaningful when --gate is turned on.
          if [ ! -f "${primary}" ] || [ ! -f "${second}" ]; then
            echo "Skipping cross-model comparison: a report is missing (one of the eval steps did not finish)." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python -m eval.compare_runs "${primary}" "${second}" \
            --min-pass-rate 0.9 \
            --min-pass-rate-second 0.85 \
            --gate both \
            --output "results/eval-comparison.json"

      # -------------------------------------------------------------------
      # Store API / UCP suite — runs by default; skip with run_store=false.
      # -------------------------------------------------------------------
      - name: Fetch sales-channel access key
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        id: sc
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "${APP_URL}/api/oauth/token" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"password","client_id":"administration","scope":"write","username":"admin","password":"shopware"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          SC_KEY=$(curl -fsS "${APP_URL}/api/sales-channel?limit=50" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((sc.get('attributes',sc).get('accessKey') for sc in d.get('data',[]) if sc.get('attributes',sc).get('accessKey')),''))")
          echo "::add-mask::${SC_KEY}"
          echo "sc_access_key=${SC_KEY}" >> "$GITHUB_OUTPUT"

      - name: Run Store API functional tests
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.sc.outputs.sc_access_key }}
        run: python -m functional.runner --endpoint store

      - name: Run Store API LLM eval (advisory)
        if: env.RUN_STORE == 'true' && env.STORE_PLUGIN_OK == 'true'
        continue-on-error: true
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.sc.outputs.sc_access_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")
          # --advisory: this step is continue-on-error, so its row must not be
          # read as a gating verdict. Without the suite label it rendered as a
          # third, unexplained openai/gpt-4o result.
          # --output is fixed rather than left to the default timestamped name
          # so the summary step can name this report explicitly for the per-tool
          # scorecard, the way it already does for the two admin runs.
          python -m eval.runner --endpoint store "${args[@]}" \
            --output "results/eval-store.json" \
            --summary-row "results/rows/3-store.json" \
            --suite-label "store · UCP" \
            --advisory

      # One render for the whole job. The three eval runs are separate
      # processes, so they emit JSON rows rather than markdown — appended
      # markdown from separate processes cannot form a single table, which is
      # why this used to be three one-row tables with the comparison wedged in
      # between them.
      #
      # The condition matches the other post-eval steps rather than always():
      # it must still run when the gate FAILS (that is when the summary is most
      # worth reading), but not when setup died before the primary eval, where
      # it would only turn one real failure into two.
      #
      # No continue-on-error, for the reason stated on the compare step: it
      # reports a failed step as successful. A broken renderer should be
      # visible; the read paths inside summary.py are the defensive part.
      - name: Write job summary
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          # --reports names this job's three reports explicitly. It must not
          # become a glob over results/: that directory is committed and holds
          # every historical report, so a glob would pool runs from months ago —
          # against older descriptions and older fixtures — into a table
          # presented as this job's. A report that did not run is simply absent.
          python -m eval.summary \
            --rows "results/rows" \
            --comparison "results/eval-comparison.json" \
            --reports "results/eval-primary.json" \
                      "results/eval-second-validator.json" \
                      "results/eval-store.json"

      # Advisory, and non-gating by construction — cost_drift always exits 0.
      # A cost regression is invisible in the pass rate: discovery taking two
      # extra search rounds per fixture, or a tool that starts returning ten
      # times the payload, moves the bill and nothing else.
      - name: Cost drift (advisory)
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          python -m eval.cost_drift \
            --current "results/eval-primary.json" \
            --previous "baseline/eval-primary.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # Only the nightly writes the baseline. A PR run saving its own numbers
      # would make the next PR's comparison meaningless — the point of
      # comparison is a known-good scheduled run on trunk, not whatever landed
      # in CI most recently.
      - name: Save cost baseline
        if: ${{ github.event_name == 'schedule' && !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          mkdir -p baseline
          cp results/eval-primary.json baseline/ 2>/dev/null || true

      - name: Persist cost baseline
        if: ${{ github.event_name == 'schedule' && !cancelled() && steps.eval.conclusion != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: eval-cost-baseline-${{ github.run_id }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tool-history snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-history-${{ github.run_id }}
          path: tool-history/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump symfony server logs on failure
        if: failure()
        run: |
          LOG_DIR="$HOME/.config/symfony-cli/log"
          if [ ! -d "$LOG_DIR" ]; then
            echo "No symfony log dir at $LOG_DIR"
            exit 0
          fi
          # tail (not follow) every log file under the symfony-cli log dir
          for f in "$LOG_DIR"/*.log "$LOG_DIR"/*/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 200 lines) ==="
            tail -n 200 "$f" || true
          done
          # Also dump Shopware's own var/log if present
          SW_LOG="${{ github.workspace }}/shopware/var/log"
          if [ -d "$SW_LOG" ]; then
            for f in "$SW_LOG"/*.log; do
              [ -f "$f" ] || continue
              echo "=== $f (last 200 lines) ==="
              tail -n 200 "$f" || true
            done
          fi

      - name: Stop Shopware
        if: always()
        working-directory: shopware
        run: symfony server:stop 2>/dev/null || true
