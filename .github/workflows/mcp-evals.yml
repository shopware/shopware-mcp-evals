name: MCP Evals

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      shopware_ref:
        description: 'Shopware ref to evaluate against (branch, tag, or sha)'
        required: false
        default: 'poc/mcp-server'
      eval_provider:
        description: 'LLM provider for the eval (anthropic | openai)'
        required: false
        default: 'openai'
      eval_model:
        description: 'Override default model for the chosen provider'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mcp-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    name: Run MCP evals
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHOPWARE_REPO: shopware/shopware
      SHOPWARE_REF: ${{ github.event.inputs.shopware_ref || 'poc/mcp-server' }}
      EVAL_PROVIDER: ${{ github.event.inputs.eval_provider || 'openai' }}
      EVAL_MODEL: ${{ github.event.inputs.eval_model || '' }}
      APP_URL: http://localhost:8000

    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      # Installs PHP, MySQL, composer, clones shopware/shopware @ ref into ./shopware,
      # and runs system:install. Org-standard primitive used across Shopware repos.
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ env.SHOPWARE_REF }}
          shopware-repository: ${{ env.SHOPWARE_REPO }}
          path: shopware
          install: true
          env: test
          php-version: '8.3'

      # The default GITHUB_TOKEN can only check out other private repos in the same
      # org if those repos have granted access via Settings → Actions → Access.
      # Falls back to a PAT secret (PLUGINS_PAT) if you provide one.
      - name: Checkout SwagMcpDevTools (bundle)
        uses: actions/checkout@v4
        with:
          repository: shopware/SwagMcpDevTools
          token: ${{ secrets.PLUGINS_PAT || github.token }}
          path: shopware/custom/plugins/SwagMcpDevTools
          fetch-depth: 1

      - name: Checkout SwagMcpMerchantAssistant (plugin)
        uses: actions/checkout@v4
        with:
          repository: shopware/SwagMcpMerchantAssistant
          token: ${{ secrets.PLUGINS_PAT || github.token }}
          path: shopware/custom/plugins/SwagMcpMerchantAssistant
          fetch-depth: 1

      - name: Wire up MCP bundle + plugin
        working-directory: shopware
        run: |
          set -euo pipefail

          composer config repositories.swag-mcp-dev-tools          path custom/plugins/SwagMcpDevTools
          composer config repositories.swag-mcp-merchant-assistant path custom/plugins/SwagMcpMerchantAssistant
          composer require \
            swag/mcp-dev-tools:@dev \
            swag/mcp-merchant-assistant:@dev \
            --no-interaction --no-scripts

          # Register the dev-tools bundle in config/bundles.php.
          # The plugin (SwagMcpMerchantAssistant) is activated via plugin:install below.
          mkdir -p config
          [ -f config/bundles.php ] || echo '<?php return [];' > config/bundles.php
          php -r '
            $file = "config/bundles.php";
            $bundles = require $file;
            $bundles[Swag\McpDevTools\SwagMcpDevToolsBundle::class] = ["all" => true];
            file_put_contents($file, "<?php\n\nreturn ".var_export($bundles, true).";\n");
          '

          bin/console plugin:refresh --no-interaction
          bin/console plugin:install --activate SwagMcpMerchantAssistant --no-interaction
          bin/console cache:clear --no-interaction

      - name: Start Shopware (built-in PHP server)
        working-directory: shopware
        run: |
          set -euo pipefail
          php -d memory_limit=512M -S 0.0.0.0:8000 -t public public/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/php.pid"

          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/api/_info/version 2>/dev/null; then
              echo "Shopware ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Shopware did not become ready in time"
          tail -n 200 "$RUNNER_TEMP/php.log" || true
          exit 1

      - name: Create integration
        id: integration
        run: |
          set -euo pipefail

          ACCESS_KEY="SWIA$(openssl rand -hex 12 | tr 'a-f' 'A-F')"
          SECRET_KEY="$(openssl rand -hex 32)"

          TOKEN=$(curl -fsS -X POST "${APP_URL}/api/oauth/token" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"password","client_id":"administration","scope":"write","username":"admin","password":"shopware"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')

          curl -fsS -X POST "${APP_URL}/api/integration" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"label\":\"mcp-evals\",\"accessKey\":\"${ACCESS_KEY}\",\"secretAccessKey\":\"${SECRET_KEY}\",\"admin\":true,\"writeAccess\":true}" \
            > /dev/null

          echo "::add-mask::${SECRET_KEY}"
          {
            echo "access_key=${ACCESS_KEY}"
            echo "secret_key=${SECRET_KEY}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python deps
        run: pip install -r eval/requirements.txt

      - name: Snapshot MCP tool descriptions
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: |
          mkdir -p tool-history
          python eval/snapshot_tools.py --output tool-history/latest.json
          cp tool-history/latest.json "tool-history/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"

      - name: Commit tool-history snapshot (cron only)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add tool-history/latest.json

          if git diff --staged --quiet; then
            echo "No description changes — nothing to commit."
            exit 0
          fi

          SHOPWARE_SHA=$(git -C shopware rev-parse --short HEAD 2>/dev/null || echo unknown)
          git commit -m "chore: refresh MCP tool snapshot (shopware@${SHOPWARE_SHA})"
          git push

      - name: Run functional tests
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
        run: bash functional/run.sh

      - name: Run LLM eval
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.integration.outputs.access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.integration.outputs.secret_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")
          python eval/run.py "${args[@]}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload tool-history snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-history-${{ github.run_id }}
          path: tool-history/
          if-no-files-found: ignore
          retention-days: 90

      - name: Capture PHP server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shopware-php-log-${{ github.run_id }}
          path: ${{ runner.temp }}/php.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Shopware
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/php.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/php.pid")" 2>/dev/null || true
          fi
