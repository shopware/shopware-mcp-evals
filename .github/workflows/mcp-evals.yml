name: MCP Evals

on:
  # Opt-in per PR, via the `run-evals` label. Not every PR: a run installs
  # Shopware, spends real OpenAI credit, and takes minutes, while most changes
  # here are fixtures, scoring or docs that lint.yml already covers. The job is
  # gated on the label (see `if:` below), so an unlabelled PR costs nothing.
  #
  # `labeled` starts a run the moment the label goes on; `synchronize` re-runs it
  # on later pushes for as long as the label stays. Remove the label to stop.
  #
  # WHO CAN SPEND MONEY HERE — the label IS the access control, and it is GitHub's,
  # not ours:
  #
  #   * Applying a label requires **triage permission or higher** on this
  #     repository. An outside contributor cannot label their own PR, so they
  #     cannot start a paid run. There is nothing to add here; a hand-rolled
  #     membership check would be weaker than the permission it duplicates.
  #   * `pull_request`, never `pull_request_target`. That matters: the fork's code
  #     never runs with our secrets, so there is no pwn-request path to the API
  #     keys.
  #   * GitHub does not pass repository secrets to a `pull_request` run from a
  #     fork. So even a labelled fork PR cannot reach OPENAI_API_KEY — which is
  #     also why the gate below refuses forks outright rather than building a lane
  #     that could only fail on an empty key after burning the minutes.
  #
  # Keep it that way. Switching to `pull_request_target`, or widening the trigger
  # to run without the label, converts a free PR into a billable one.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      shopware_ref:
        description: 'Shopware ref to evaluate against (branch, tag, or sha). Default: contents of shopware.sha (pinned). Cron uses trunk.'
        required: false
        default: ''
      # A dropdown, not free text, and openai is the only option because it is the
      # only provider with a key: the repo secrets are OPENAI_API_KEY and
      # PLUGINS_PAT. Typing `anthropic` here used to be accepted, then failed ~140s
      # in on an empty ANTHROPIC_API_KEY, after the whole Shopware install.
      #
      # To enable Anthropic: add the ANTHROPIC_API_KEY secret and add 'anthropic'
      # back to the options below. The runner already supports it (`--provider
      # anthropic`), and the step still passes the secret through, so nothing else
      # needs changing.
      eval_provider:
        description: 'LLM provider for the eval'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
      eval_model:
        description: 'Override the default model for the chosen provider (e.g. gpt-4o-mini). Affects the primary arm only; the second validator is pinned to gpt-4o-mini.'
        required: false
        default: ''
      dev_tools_ref:
        description: 'SwagMcpDevTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      merchant_tools_ref:
        description: 'SwagMcpMerchantTools ref (branch, tag, or sha). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      agentic_commerce_ref:
        description: 'shopware/agentic-commerce ref (used when the Store suite runs). Default: empty = the repo default branch (latest).'
        required: false
        default: ''
      ucp_sdk_ref:
        description: 'ucp-php-sdk Composer constraint, e.g. 0.0.5 or >=0.0.5 <0.1.0. Default: >=0.0.5 <0.1.0, the release whose oneOf failures name the branch and the missing field — the difference between "$ must match exactly one allowed schema" and being told order_confirmation lacks permalink_url. Use a RANGE, not a caret: on a 0.0.x package Composer pins the patch, so ^0.0.5 excludes 0.0.6. No longer a git ref — the SDK comes from Packagist.'
        required: false
        default: ''
      run_store:
        description: 'Run the Store API / UCP suite. On by default; set false to skip it (saves the agentic-commerce checkout and ~42 LLM fixtures).'
        required: false
        default: 'true'
      triage:
        description: 'Re-run the failures under the isolated and full arms to locate each one (own description / cross-group collision / discovery layer). Nightly does this anyway; use this to diagnose on demand.'
        required: false
        default: 'false'

permissions:
  contents: write
  # The nightly reconciliation PR needs this; contents: write alone can push a
  # branch but not open a pull request for it.
  pull-requests: write

concurrency:
  group: mcp-evals-${{ github.ref }}
  # Superseded PR runs are cancelled; nightly and manual dispatch never are.
  #
  # Each run installs Shopware and spends real LLM credit, so several pushes in
  # quick succession used to leave four full runs racing for a result only the
  # last of which anyone would read. On a PR the newest commit is the only one
  # that matters.
  #
  # Scoped to pull_request on purpose: the group keys on github.ref, so without
  # the condition a push to the default branch would cancel a nightly halfway
  # through — and the nightly is the run that opens the reconciliation PR and
  # carries the only Store catalogue snapshot we get.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow level, not job level. These were declared on the single job that used
# to do everything; splitting it into four dropped them, and GitHub renders an
# undefined `env.X` as an empty string rather than failing — so RUN_STORE went
# empty, the agentic-commerce checkout silently skipped, and the lane came up
# with 21 of 30 tools. Declaring them here means a fifth job cannot repeat that.
env:
  SHOPWARE_REPO: shopware/shopware
  EVAL_PROVIDER: ${{ github.event.inputs.eval_provider || 'openai' }}
  EVAL_MODEL: ${{ github.event.inputs.eval_model || '' }}
  APP_URL: http://localhost:8000
  # The 0.90/0.85 gates stay, and both arms gate. There is no advisory window.
  #
  # There was one, briefly, and removing it is the point worth recording. `passed`
  # changed meaning — the call now has to run and satisfy the fixture, not merely
  # name the right tool — so the thresholds were suspected of no longer describing
  # the same quantity, and the second validator was held advisory while that got
  # re-derived. Measured under the new definition: primary 99% (95/96) with core
  # at 100%, second validator 88% (84/96) with core at 88%. Both clear their own
  # gate; the window never once changed a verdict.
  #
  # What the 79% before it actually was: fixtures naming ids the lane could not
  # supply. All five of the primary's failures and six of the validator's twenty
  # were the right tool called with an invented id — see the {placeholder} rules
  # in eval/fixtures.yaml. Fixing the lane moved the validator 79% -> 88%, which
  # is why no threshold needed moving.
  #
  # Do not reintroduce a suppression to carry a regression. A warning on a gate
  # nobody is enforcing is a red build that has learned to look green, and the
  # thing it hides next will not be a lane defect.
  #
  # Lets the placeholder resolvers open a cart on the instance, so {cart_token}
  # and {line_item_id} resolve to something checkout can actually take. Only
  # ever true here: the lane is destroyed with the job. Off, those fixtures are
  # skipped by name rather than graded against a token nothing can resolve.
  EVAL_SEED_LANE: 'true'
  #
  # The eval is the bulk of the wall clock: ~425s of summed fixture latency per
  # model, which at the old 4-way concurrency was ~106s of a 155s step. It sat
  # at 4 because the MCP endpoint answered 429 above that, and the step below
  # now disables the MCP rate limiter on the throwaway instance, which removes
  # that ceiling. Measured effect: the two eval steps went 314s -> ~150-170s.
  #
  # 12 is deliberately short of the theoretical floor. sum_latency/12 is ~35s
  # against a slowest-single-fixture bound of ~14s, so there is still headroom,
  # and the next ceilings (the OpenAI account's own limits and one PHP-FPM
  # worker pool) are not measured yet. The runner reads this as the default for
  # --discovery-concurrency, so it applies to the admin and store suites alike.
  EVAL_DISCOVERY_CONCURRENCY: '12'
  # Store/UCP suite: on by default, opt OUT with run_store=false.
  # `github.event.inputs` is null on push/schedule, so `!= 'false'` resolves
  # to true there — which is the point. It used to be `== 'true'`, meaning
  # the whole Store suite only ever ran on a manual dispatch that nobody
  # triggered, so its 42 fixtures had never once executed against a server.
  RUN_STORE: ${{ github.event.inputs.run_store != 'false' }}
  # Nightly always triages. On a PR, the `run-triage` label asks for it; on a
  # manual dispatch, the `triage` input does. Not on by default — it re-runs
  # failures under two more arms, which costs real money on a branch that may
  # still be iterating.
  #
  # The label exists because workflow_dispatch inputs are validated against
  # the workflow file on the DEFAULT branch, so the input below cannot be
  # passed until this file is on main. A label is read from the event and
  # works on the branch immediately.
  TRIAGE: >-
    ${{ github.event_name == 'schedule'
        || github.event.inputs.triage == 'true'
        || contains(github.event.pull_request.labels.*.name, 'run-triage') }}


jobs:
  # ---------------------------------------------------------------------------
  # 1. Static proof. No model, no LLM spend.
  #
  # Everything here answers a question an LLM cannot: is a tool registered, is it
  # advertised, does it actually run. It gates the eval jobs, because grading a
  # model on a tool that cannot run charges a plugin bug to the model and pays
  # full model price per fixture to rediscover what one direct call establishes.
  # ---------------------------------------------------------------------------
  # Runs ONLY for a labelled fork PR, to say why nothing else will. Without it
  # the label looks broken: applied, accepted, and then silence. Costs one
  # ubuntu-latest second and no secrets.
  fork-notice:
    name: Why this PR cannot run the evals
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'run-evals') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::The \`run-evals\` label is set, but this PR comes from a fork and the evals cannot run for it. GitHub does not pass repository secrets to a \`pull_request\` run from a fork, so OPENAI_API_KEY would be empty and the suite would fail after installing Shopware — minutes spent for no measurement.%0ATo evaluate these changes, push the branch to this repository and label that PR, or run the workflow manually from the Actions tab against a branch here."

  static:
    name: Static checks
    # Three conditions, and the fork one is not paranoia: a labelled fork PR gets
    # no secrets, so it can only burn a full Shopware install and then fail on an
    # empty API key. `fork-notice` above explains that in the run itself.
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'run-evals') && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      store_plugin_ok: ${{ steps.lane.outputs.store_plugin_ok }}
      # Whether the Store suite has anything to measure. Separate from the job's
      # own success on purpose: a UCP environment problem must not block the
      # admin gate, which is the isolation this split exists for.
      #
      # The step's own `ready` output, not `steps.preflight.outcome`. Reading the
      # outcome required the step to EXIT non-zero to say "not ready", which the
      # runner then annotated as an error on a job that had passed. An output
      # carries the same one bit without claiming anything failed.
      #
      # `== 'true'`, so a preflight that never ran (RUN_STORE off, or the plugin
      # missing) leaves this false and the store eval does not start. Only an
      # actual green preflight may spend money.
      store_ready: ${{ steps.preflight.outputs.ready == 'true' }}
      shopware_sha: ${{ steps.lane.outputs.shopware_sha }}
      drift: ${{ steps.drift.outputs.drift }}
      snapshot_changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Bootstrap Python
        uses: ./.github/actions/bootstrap

      - name: Set up the lane
        id: lane
        uses: ./.github/actions/setup-lane
        with:
          shopware_repo: ${{ env.SHOPWARE_REPO }}
          shopware_ref: ${{ github.event.inputs.shopware_ref }}
          event_name: ${{ github.event_name }}
          app_url: ${{ env.APP_URL }}
          run_store: ${{ env.RUN_STORE }}
          dev_tools_ref: ${{ github.event.inputs.dev_tools_ref }}
          merchant_tools_ref: ${{ github.event.inputs.merchant_tools_ref }}
          agentic_commerce_ref: ${{ github.event.inputs.agentic_commerce_ref }}
          plugins_pat: ${{ secrets.PLUGINS_PAT }}
          github_token: ${{ github.token }}

      - name: Snapshot MCP tool descriptions
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.lane.outputs.sw_access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.lane.outputs.sw_secret_key }}
        run: |
          mkdir -p tool-history
          python -m eval.snapshot_tools --output tool-history/latest.json
          cp tool-history/latest.json "tool-history/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"

      # If the snapshot differs from the committed baseline, descriptions have
      # drifted upstream and the eval expectations may need updating. Treat the
      # LLM eval as advisory in that case so PR/main runs stay green until a
      # reconciliation PR bumps shopware.sha + baseline + expectations together.
      # Deliberately a separate output from `drift`. `drift` means the admin
      # catalogue moved, which downgrades the admin gate to advisory — a Store
      # snapshot changing is no reason to weaken an admin gate. This one only
      # decides whether there is something to commit.
      #
      # `git status --porcelain` rather than `git diff`: store.json is untracked
      # until the first snapshot lands, and `git diff` says nothing about an
      # untracked file — so the very run that first produces it would report
      # nothing to do and never open the PR that commits it.
      - name: Detect tool description drift
        id: drift
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch tool-history/latest.json > /dev/null 2>&1; then
            if git diff --quiet -- tool-history/latest.json; then
              echo "drift=false" >> "$GITHUB_OUTPUT"
              echo "No description drift vs committed baseline."
            else
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Tool description drift detected vs committed baseline."
              # `eval.drift` names what moved. The raw diff stays below it, folded,
              # because 200 lines of JSON is evidence rather than a finding — a
              # reader needs "these 11 descriptions changed" first.
              git show HEAD:tool-history/latest.json > /tmp/baseline.json
              {
                python -m eval.drift --old /tmp/baseline.json --new tool-history/latest.json \
                  --heading "Tool description drift detected"
                echo ""
                echo "Shopware ref: \`${{ steps.lane.outputs.shopware_ref }}\` → \`${{ steps.lane.outputs.shopware_sha }}\`"
                echo ""
                echo "LLM eval failures will be advisory (non-blocking) for this run."
                echo ""
                echo "<details><summary>Raw snapshot diff</summary>"
                echo ""
                echo '```diff'
                git diff -- tool-history/latest.json | head -200
                echo '```'
                echo ""
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No committed baseline (tool-history/latest.json); treating as drift."
          fi

      # Prove one tool actually executes before spending an LLM pass on 45
      # fixtures.
      #
      # This is the guard for the failure that hid for the whole life of the
      # Store suite: every UCP runtime tool rejected every call, and the suite
      # still reported a pass rate, because selection-only grading cannot tell
      # "picked the right tool" from "picked the right tool and the server
      # refused it". Execution turned that silence into 45 red fixtures — better,
      # but still a full LLM pass spent to learn what one call answers in a
      # second, and still shaped like a tool-quality result when it is an
      # environment problem.
      #
      # Hard failure, not continue-on-error: if the tools cannot run there is
      # nothing for the suite to measure, and a green run would be a lie.
      # Cross-check our safety classification against what the server declares.
      #
      # toolclass.READ_ONLY is a hand-maintained list, and being wrong about it
      # is the one classification mistake with real consequences: a tool wrongly
      # filed there is executed for real, with no dryRun, against this instance.
      # `debug:mcp` prints the ACL privileges each tool actually requires, so a
      # READ_ONLY tool needing `:update` is caught by the server disagreeing with
      # us rather than by someone noticing afterwards.
      #
      # Also catches a tool the server grew that nothing has classified yet —
      # those are silently never executed, which looks like a passing suite.
      #
      # Admin registry only: `debug:mcp` takes no endpoint flag and does not list
      # the Store/UCP tools at all (measured — 30 registered against 17 more that
      # the store endpoint advertises). eval/preflight.py covers that side.
      - name: Check the tool registry against toolclass
        if: ${{ !cancelled() }}
        run: |
          cd shopware
          bin/console debug:mcp --tools --no-ansi > /tmp/debug-mcp.txt
          cd ..
          python -m eval.registry_check --from-file /tmp/debug-mcp.txt || {
            echo "::error::The server's declared privileges disagree with toolclass.py. See above - a READ_ONLY tool that mutates would be executed for real."
            exit 1
          }

      # Only the nightly cron opens this. A cron run resolves the ref to trunk, so
      # its drift IS the upstream movement someone has to reconcile — and printing
      # instructions into a job summary nobody is watching at 06:00 is how the
      # baseline went eleven descriptions stale without anyone noticing.
      #
      # Dispatch and push runs are excluded on purpose: they resolve to the pinned
      # sha, so their "drift" is usually a deliberate local change under test, and
      # a PR for it would be noise.
      #
      # Deliberately NOT part of the gate: this is a convenience, so every failure
      # mode here is swallowed rather than allowed to fail a run whose eval passed.
      - name: Run functional tests
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.lane.outputs.sw_access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.lane.outputs.sw_secret_key }}
          # Served by the shop itself (see setup-lane), so the media-upload check
          # does not depend on a third-party host being reachable from the runner.
          MCP_MEDIA_UPLOAD_URL: ${{ env.APP_URL }}/mcp-evals-probe.png
        run: python -m functional.runner --endpoint admin

      # The Store catalogue has never been snapshotted, so everything that
      # derives from one had to be guessed for it: toolclass could not read
      # schemas to find dryRun, tests/test_fixtures.py could not validate
      # expected_toolset, and drift detection did not cover it. The Store
      # fixtures ended up declaring toolsets that do not exist ('shopware',
      # 'store-api'; the real ones are shopware-ucp-cart / -catalog / -checkout)
      # and nothing could catch it.
      #
      # Uploaded as an artifact rather than committed here: the nightly
      # reconciliation PR is where a snapshot enters the repo.
      - name: Snapshot Store tool catalogue
        if: ${{ !cancelled() && env.RUN_STORE == 'true' && steps.lane.outputs.store_plugin_ok == 'true' }}
        continue-on-error: true
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.lane.outputs.sc_access_key }}
        # The listing used to be printed to THIS job's summary, which is why the
        # run page documented the optional plugin's 17 tools and said nothing
        # about core's 30. eval/summary.py renders both from the snapshots now,
        # so this step's job is only to produce the file.
        run: |
          python -m eval.snapshot_tools --endpoint store \
            --output tool-history/store.json

      - name: Preflight the Store endpoint
        id: preflight
        # Non-fatal to the JOB, decisive for the STORE suite. It failing means
        # the UCP tools cannot run, which is a complete answer for store-eval and
        # no reason at all to withhold the admin numbers.
        #
        # It reports through an OUTPUT and exits 0, rather than exiting 1 under
        # continue-on-error. Same control flow, but the runner no longer posts
        # "Process completed with exit code 1" against a job that passed: three
        # red annotations on a green Static checks was the store suite being
        # skipped as designed, and it read as a broken build.
        if: ${{ !cancelled() && env.RUN_STORE == 'true' && steps.lane.outputs.store_plugin_ok == 'true' }}
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.lane.outputs.sc_access_key }}
        run: |
          # Captured rather than piped: `if cmd | tee` takes tee's exit status, and
          # `set -o pipefail` here would make the unguarded pipelines further down
          # (find | head) fatal. Redirect, record the status, then print.
          if python -m eval.preflight --endpoint store >/tmp/preflight.log 2>&1; then
            preflight_ok=true
          else
            preflight_ok=false
          fi
          cat /tmp/preflight.log

          if [ "${preflight_ok}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # The MCP layer answers an escaped exception with a generic "Error
            # while executing tool" that carries none of the underlying message,
            # so the diagnosis table has nothing to match on. The exception
            # itself only exists in Shopware's log, and the end-of-job dump runs
            # too late and too broadly to be useful. Pull it here, while we know
            # exactly which call produced it.
            # The UCP-Agent profile URI is fetched BY THE SERVER, mid-request,
            # and a failure there escapes as a bare `internal` with nothing
            # logged. So probe it directly: in CI the runner and the server share
            # localhost:8000, which makes a runner-side fetch equivalent to the
            # server's own. This is the single most likely cause and the one the
            # error text can never name.
            # Which host is which, stated rather than assumed. The whole failure
            # class here is three addresses for one shop that are not
            # interchangeable: what the runner uses, what the server believes it is
            # (its own APP_URL), and what the server can actually resolve from
            # inside. On a proxied lane those diverge — APP_URL came back as the one
            # host the container could NOT resolve — and every message about it
            # names a URL without saying whose view it is. In CI they should all
            # agree; if they ever stop agreeing, this is the line that says so.
            echo "--- addresses in play ---"
            echo "  runner -> shop:                  ${APP_URL}"
            # setup-lane passes APP_URL to the steps that call the shop; it never
            # writes it into the checkout, so on a CI lane these files usually do
            # not carry it and "not found" is the normal answer rather than a
            # finding. Said that way round on purpose: the first version printed
            # "unset", which reads as "the server has no APP_URL" and is a
            # different claim from "I did not find it here".
            server_app_url=$(grep -hE '^APP_URL=' \
              shopware/.env.local shopware/.env shopware/.env.local.php 2>/dev/null \
              | tail -1 | sed -e "s/^APP_URL=//" -e "s/^['\"]//" -e "s/['\",;]*$//" || true)
            echo "  APP_URL as the SERVER sees it:   ${server_app_url:-(not written into shopware/.env*; inherited from the environment)}"
            profile_uri=$(sed -n 's/.*profile="\([^"]*\)".*/\1/p' /tmp/preflight.log | head -1)
            echo "  profile URI the server fetches:  ${profile_uri:-(not printed)}"
            if [ -n "${server_app_url}" ] && [ "${server_app_url%/}" != "${APP_URL%/}" ]; then
              echo "  ^ these disagree, which is enough on its own to break the profile fetch"
            fi

            echo "--- can the profile URI actually be fetched? ---"
            profile="${APP_URL}/.well-known/ucp"
            code=$(curl -s -o /tmp/profile.json -w '%{http_code}' --max-time 10 "${profile}" || echo "000")
            echo "GET ${profile} -> ${code}"
            [ "${code}" = "200" ] && head -c 300 /tmp/profile.json && echo

            # The step that makes the log dump below worth reading. The MCP tool
            # catches the throwable and answers `internal` with nothing logged, so
            # up to now the grep had nothing to find and faithfully reported
            # "(nothing matched)" on every run. The REST route for the SAME
            # operation does not swallow it: the exception reaches Symfony's
            # handler and is written to var/log. That is how this class of failure
            # was finally diagnosed locally, and doing it here means a run
            # diagnoses itself instead of waiting for someone to reproduce it.
            #
            # Non-fatal throughout: this whole block runs only because preflight
            # already failed, and it reports through an output rather than an exit
            # code (see above).
            echo "--- the same operation over REST, which does not swallow the exception ---"
            rest="${APP_URL}/ucp/v1/catalog/search"
            echo "POST ${rest}"
            rest_out=$(curl -sS -X POST "${rest}" \
              -H 'Content-Type: application/json' \
              -H "sw-access-key: ${SW_SC_ACCESS_KEY}" \
              -H "UCP-Agent: shopware-mcp-evals profile=\"${APP_URL}/.well-known/ucp\"" \
              -d '{"query":"test","limit":5}' \
              -w '\nHTTP %{http_code}' --max-time 20 2>&1 || true)
            echo "${rest_out}" | head -c 800
            echo

            echo "--- logs ---"
            # BOTH log locations, and the second one is the point. The SDK's
            # ExceptionListener does log this exception — `debug:container` shows
            # its logger argument wired to Service(monolog.logger), and the
            # fallback branch calls
            # $this->logger?->error('Unhandled exception while processing a UCP
            # request.', ['exception' => $throwable]). So "the plugin logs
            # nothing" was wrong: this block was reading the wrong file.
            #
            # Under `symfony server:start` the server's output goes to
            # $HOME/.config/symfony-cli/log, not shopware/var/log — which is why
            # .github/actions/dump-logs tails that directory and this did not.
            # Six runs reported "(nothing matched)" from a directory that was
            # never going to contain it.
            hits=""
            # An INVENTORY of what exists, separate from the grep. Two runs
            # reported only symfony-cli access lines and no application log line
            # at all, and with a filtered view there is no way to tell "the
            # exception was not logged" from "the file holding it was not
            # searched". This records which directories were searched, how many
            # files each held, and the newest file in each — the facts needed to
            # tell those two apart.
            inventory=""
            swlog=$(find shopware/var -maxdepth 2 -type d -name log 2>/dev/null | head -1)
            for dir in "${swlog}" "$HOME/.config/symfony-cli/log" shopware/var/log; do
              if [ -z "${dir}" ] || [ ! -d "${dir}" ]; then
                inventory="${inventory}[${dir:-unset}: absent] "
                continue
              fi
              count=$(find "${dir}" -type f -name '*.log' 2>/dev/null | wc -l | tr -d ' ')
              newest=$(find "${dir}" -type f -name '*.log' -exec ls -1t {} + 2>/dev/null | head -1)
              inventory="${inventory}[${dir}: ${count} files, newest=$(basename "${newest:-none}")] "
              echo "=== ${dir}"
              ls -la "${dir}" 2>/dev/null || true
              # Match on SEVERITY and on the listener's own message, not on the
              # text mentioning UCP: an exception thrown inside a capability (a
              # DAL error, say) mentions no UCP at all and was invisible.
              found=$(grep -rhiE 'Unhandled exception|app\.(ERROR|CRITICAL)|request\.CRITICAL|ucp' \
                "${dir}" 2>/dev/null | tail -n 20 || true)
              if [ -n "${found}" ]; then
                echo "${found}"
                hits="${hits}${found}"$'\n'
              fi
            done
            # `grep | tail` exits 0 on empty input, so `|| echo` never fires.
            if [ -z "${hits}" ]; then echo "  (nothing matched in either location)"; fi
            # ::warning::, not ::error::. The store suite being skipped is the
            # designed outcome of a plugin that cannot execute, and it does not
            # gate anything. An error annotation here is indistinguishable from
            # one that failed the build.
            # The substance goes in the ANNOTATION, not only in the log. A run's
            # log is not readable through the REST API on a job that passed — and
            # this job does pass, by design, because the store suite being skipped
            # is not a build failure. So a diagnosis that lives only in stdout can
            # be read by a human in the web UI and by nothing else, which is how a
            # self-diagnosing run stops diagnosing anything. Annotations come back
            # from the API, so put the two facts that matter there.
            #
            # %0A is a newline in a workflow command; the literal text would be
            # taken as the end of the message.
            err=$(sed -n 's/^  error: //p' /tmp/preflight.log | head -1)
            rest_status=$(printf '%s' "${rest_out}" | tail -1)
            rest_code=$(printf '%s' "${rest_out}" | sed -n 's/.*"code":"\([a-z_]*\)".*/\1/p' | head -1)
            # The REST BODY, not just its status line. Three runs reported
            # "Same call over REST: HTTP 500" and stopped there, which says only
            # that something threw — the body is where the exception message is,
            # and it was being captured into ${rest_out}, printed to stdout, and
            # then dropped from the annotation. That mattered because the log it
            # was left in turned out to be unreadable: one ANSI-coloured line
            # anywhere in a job makes the whole log unretrievable through the
            # REST API ("the response contains terminal escape sequences"), so
            # "full diagnosis in the log" was not a fallback at all.
            #
            # Flattened to one line and capped, because an annotation is one
            # message: newlines would truncate it at the first one.
            rest_body=$(printf '%s' "${rest_out}" | tr '\n' ' ' | tr -s ' ' | cut -c1-500)
            # Prefer the listener's own line, which names the exception class and
            # message, over whatever happens to be last in the file. Failing
            # that, prefer ANY line mentioning an exception or a PHP fatal over
            # the access log, which is what the fallback kept returning.
            log_tail=$(printf '%s' "${hits}" | grep -i 'Unhandled exception' | head -1 | tr -s ' ' | cut -c1-900)
            if [ -z "${log_tail}" ]; then
              log_tail=$(printf '%s' "${hits}" | grep -iE 'exception|fatal|stack trace|\.php:[0-9]' \
                | grep -v '"source":"server"' | head -2 | tr '\n' ' ' | tr -s ' ' | cut -c1-900)
            fi
            if [ -z "${log_tail}" ]; then
              log_tail="no application log line found — searched ${inventory}"
            fi
            echo "::warning::Store preflight failed - UCP tools cannot execute, so the store suite is skipped.%0AMCP said: ${err:-(no error line)}%0ASame call over REST: ${rest_status:-(no response)} ${rest_code:+code=${rest_code}}%0AREST body: ${rest_body:-(empty)}%0AShopware log: ${log_tail:-(nothing matched)}%0AAddresses: runner=${APP_URL} profile=${profile_uri:-unknown}${server_app_url:+ server-APP_URL=${server_app_url}}"
          fi

      - name: Run Store API functional tests
        if: ${{ !cancelled() && env.RUN_STORE == 'true' && steps.lane.outputs.store_plugin_ok == 'true' }}
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.lane.outputs.sc_access_key }}
          # The promotion created by setup-lane. functional/journeys.py reads this
          # and skips the discount step without it, which is what it did on every
          # run before the lane created one.
          UCP_JOURNEY_PROMO_CODE: ${{ steps.lane.outputs.promo_code }}
        run: |
          # --allow-mutations: the UCP journey commits, because the plugin rolls
          # every dry run back and a rolled-back cart cannot be the next step's
          # precondition. Safe here and nowhere else — this instance is destroyed
          # with the job.
          #
          # Warns instead of failing, for the reason on the preflight above: this
          # was continue-on-error already, so its exit code changed nothing except
          # to post a red annotation on a green job. The report JSON in
          # static-results carries every assertion either way.
          # Output captured to a file so the FAIL lines can go in the annotation as
          # well as the log. "see the log above" is not a usable pointer here: one
          # ANSI-coloured line anywhere in the job makes the whole log
          # unretrievable through the API, so on a passing job the failing check
          # names were readable in the web UI and nowhere else.
          #
          # Redirect, NOT `| tee`, and `|| rc=$?` rather than PIPESTATUS. The first
          # version of this used `set -o pipefail` plus `rc=${PIPESTATUS[0]}`, which
          # is right about tee (a pipeline reports tee's status, always 0) and wrong
          # about everything else: a workflow `run:` is `bash -e`, so with pipefail
          # on, a failing python aborts the step AT THE PIPELINE and the line reading
          # PIPESTATUS never executes. The annotation could not fire, and a suite
          # failure took the whole job red — which is what it had been rewritten to
          # avoid. Measured on run #257: exit code 1, no annotation.
          #
          # No pipe means no pipefail question, and `|| rc=$?` keeps `set -e` from
          # aborting while still capturing the code.
          rc=0
          python -m functional.runner --endpoint store --allow-mutations \
            > /tmp/functional-store.log 2>&1 || rc=$?
          cat /tmp/functional-store.log

          # ANSI stripped before matching. functional/reporting.py gates colour on
          # `sys.stdout.isatty()`, so a redirect already yields plain text and the
          # patterns below work — but they anchor on `^\s*FAIL`, which a single
          # escape sequence would silently defeat, turning every annotation into
          # "(none captured)" with nothing to say why. Cheap insurance, and it
          # documents that the greps depend on that gating.
          plain=$(sed $'s/\033\\[[0-9;]*m//g' /tmp/functional-store.log)
          counts=$(printf '%s\n' "${plain}" | grep -E 'Results: ' | tail -1 | tr -s ' ')

          # The tally and the SKIPs go out on EVERY run, as a notice, not only when
          # something fails. A green run with a skipped check reported nothing at
          # all before this, so "20 passed, 2 failed, 1 skipped" left the identity
          # of that skip unknowable without opening the run — and a skip that
          # nobody can see is indistinguishable from coverage. This is what makes
          # the standing "is media-upload passing or skipping?" question answerable
          # from the annotation alone.
          skips=$(printf '%s\n' "${plain}" | grep -E '^\s*SKIP ' | head -8 \
            | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-900)
          echo "::notice::Store API functional tests. ${counts:-(no tally line)}%0A${skips:-No skipped checks.}"

          if [ "${rc}" -ne 0 ]; then
            fails=$(printf '%s\n' "${plain}" | grep -E '^\s*FAIL ' | head -8 \
              | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-1200)
            echo "::warning::Store API functional tests reported failures. ${counts}%0A${fails:-(no FAIL lines captured)}"
          fi

      - name: Detect snapshot changes worth committing
        id: snapshot
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- tool-history/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- tool-history/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # tool-health gates the eval jobs; the snapshots feed the nightly
      # reconciliation PR in `report`. Both cross a job boundary, so both have to
      # be artifacts rather than files on a runner that is about to be destroyed.
      - name: Upload static results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-results
          path: |
            results/
            tool-history/
          retention-days: 14
          if-no-files-found: warn

      - name: Dump symfony server logs on failure
        if: failure()
        uses: ./.github/actions/dump-logs

      - name: Stop Shopware
        if: always()
        working-directory: shopware
        run: symfony server:stop 2>/dev/null || true


  # ---------------------------------------------------------------------------
  # 2a. The gating suite. Four arms, two of them advisory.
  # ---------------------------------------------------------------------------
  admin-eval:
    name: Admin eval
    needs: static
    # `!= 'skipped'` rather than `== 'success'`: static failing on an admin check
    # is still worth the eval's diagnosis, and the store steps inside it can no
    # longer fail the job at all.
    if: ${{ !cancelled() && needs.static.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Bootstrap Python
        uses: ./.github/actions/bootstrap

      - name: Set up the lane
        id: lane
        uses: ./.github/actions/setup-lane
        with:
          shopware_repo: ${{ env.SHOPWARE_REPO }}
          shopware_ref: ${{ github.event.inputs.shopware_ref }}
          event_name: ${{ github.event_name }}
          app_url: ${{ env.APP_URL }}
          run_store: ${{ env.RUN_STORE }}
          dev_tools_ref: ${{ github.event.inputs.dev_tools_ref }}
          merchant_tools_ref: ${{ github.event.inputs.merchant_tools_ref }}
          agentic_commerce_ref: ${{ github.event.inputs.agentic_commerce_ref }}
          plugins_pat: ${{ secrets.PLUGINS_PAT }}
          github_token: ${{ github.token }}

      # The verdicts the static job measured. Same code and same plugins on both
      # lanes, so its findings hold here; without it every fixture is graded,
      # including those for tools already proven broken.
      - name: Download static results
        uses: actions/download-artifact@v7
        with:
          name: static-results

      # Reduce both runs to the split that matters: a fixture BOTH models miss
      # is a tool-description problem, one only the weaker model misses is its
      # capability gap. Emits a per-tool work list to the job summary.
      #
      # --gate both enforces 90% for the primary and 85% for the second validator,
      # matching what each eval step gates itself at. This is the consolidated
      # verdict rather than the only one —
      # it exists so the policy is declared in one visible place and so the two
      # rates are compared on identical terms (both computed over fixtures that
      # actually ran, errors excluded and budgeted separately).
      #
      # Both admin models run CONCURRENTLY in this one step, because they are
      # independent: separate MCP sessions, separate report files, separate summary
      # rows. Sequentially they were 155s + 159s of a 481s job; overlapped, the pair
      # costs the slower of the two.
      #
      # One step rather than two parallel jobs: a second job would repeat the whole
      # ~140s setup (install Shopware, wire up the bundle, seed data) and then need
      # the reports shuttled between jobs as artifacts for the comparison step.
      #
      # The two gate differently, which is the whole reason this is not a plain
      # `&`-and-forget. Their exit codes are captured separately and applied
      # separately at the bottom:
      #   primary  90%, but ADVISORY when the catalogue has drifted from the
      #            committed baseline (what used to be continue-on-error on this
      #            step) — the descriptions under test are then not the ones the
      #            baseline recorded, so its verdict is not attributable.
      #   second   85%, always gating. It was briefly advisory while the
      #            thresholds were re-derived for the new meaning of `passed`;
      #            it clears 85% on its own, so the window is gone (see the env
      #            block at the top for the measured numbers).
      #
      # Output is captured per model and replayed in order afterwards. Two runners
      # writing to the same stdout interleave line by line, and these logs are how
      # a failure gets diagnosed.
      - name: Run LLM evals (primary + second validator, in parallel)
        id: eval
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_ACCESS_KEY: ${{ steps.lane.outputs.sw_access_key }}
          SW_SECRET_ACCESS_KEY: ${{ steps.lane.outputs.sw_secret_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
          DRIFTED: ${{ needs.static.outputs.drift }}
          EVAL_SEED_LANE: ${{ env.EVAL_SEED_LANE }}
        # No `set -e`: the exit codes are the result here, so the script must
        # outlive a failing runner rather than abort on the first one.
        run: |
          set -uo pipefail
          mkdir -p results/rows

          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")

          # Fixed output paths so the cross-model comparison step can find them.
          # --summary-row feeds the consolidated job summary rendered at the end of
          # the job; the numeric prefix fixes each row's position in its table.
          # After the discovery pass, re-run ONLY its failures with the
          # fixture's own toolset enabled, then with the whole catalogue
          # enabled. That separates three problems which look identical in the
          # gating arm — a bad description, a collision with another group, or a
          # discovery layer that never surfaced the tool.
          #
          # In the same invocation on purpose. A separate step would re-run the
          # whole discovery pass first just to learn what failed, doubling the
          # primary cost; here the failures are already in memory, so triage is
          # ~18 extra fixture runs (~$0.10) rather than ~96.
          if [ "${TRIAGE}" = "true" ]; then args+=(--triage); fi

          python -m eval.runner "${args[@]}" \
            --output "results/eval-primary.json" \
            --summary-row "results/rows/1-admin-primary.json" \
            --suite-label "admin · primary" > primary.log 2>&1 &
          pid_primary=$!

          # gpt-4o-mini is pinned: it is the fixed second opinion, not a
          # dispatch-overridable arm, so it ignores EVAL_PROVIDER/EVAL_MODEL.
          # EVAL_MIN_PASS_RATE applies to its overall AND core gates, because
          # min_core_pass_rate defaults to min_pass_rate — and it was the core gate
          # at 88% that once failed a run whose primary was clean.
          EVAL_MIN_PASS_RATE=0.85 python -m eval.runner --provider openai --model gpt-4o-mini \
            --output "results/eval-second-validator.json" \
            --summary-row "results/rows/2-admin-second.json" \
            --suite-label "admin · second validator" > second.log 2>&1 &
          pid_second=$!

          # Third arm: the same primary model on the same fixtures with the
          # server's context prompts withheld. It answers the one question the
          # ~20k characters of tool guide have never been asked — whether they
          # earn their place — and it is advisory, so it never gates.
          #
          # Admin only. The store endpoint serves no context prompt at all (460
          # chars of server instructions against admin's 20,606), so an arm there
          # would compare a run with nothing to a run with nothing.
          python -m eval.runner --context-prompts none "${args[@]}" \
            --output "results/eval-no-prompt.json" \
            --summary-row "results/rows/4-admin-noprompt.json" \
            --suite-label "admin · no context prompt" \
            --advisory > noprompt.log 2>&1 &
          pid_noprompt=$!

          # Fourth arm: vanilla Shopware. Only core's prompt, which is what a shop
          # with no MCP plugins installed actually serves.
          #
          # Together with `all` above this answers the question the single
          # all-or-nothing comparison could not: every fixture currently carries
          # every area's prompt, so a merchant-tools fixture arrives with 5,615
          # characters of dev-tools instructions naming tools it must not pick.
          # If an area scores better under the narrower set, that prompt is not
          # neutral — and today that shows up in the scorecard as a description
          # problem, attributed to entirely the wrong thing.
          python -m eval.runner --context-prompts core "${args[@]}" \
            --output "results/eval-core-prompt.json" \
            --summary-row "results/rows/5-admin-coreprompt.json" \
            --suite-label "admin · core prompt only" \
            --advisory > coreprompt.log 2>&1 &
          pid_coreprompt=$!

          # `|| rc=$?`, not `wait; rc=$?`. GitHub runs this with `bash -e`, which
          # the script's own `set -uo pipefail` does not undo, and a failing
          # `wait` is a simple command — so the shell exited *at the wait* the
          # first time a runner returned non-zero. Everything below never ran:
          # no `cat primary.log`, so the reason was invisible, and none of the
          # advisory handling underneath, so the DRIFTED downgrade could not
          # take effect. The step just failed with a bare exit code.
          rc_primary=0; wait "${pid_primary}" || rc_primary=$?
          rc_second=0; wait "${pid_second}" || rc_second=$?
          # Advisory: waited on so the log is complete, but its exit code never
          # reaches `failed`. A prompt-off arm scoring worse is the expected
          # result, not a broken build.
          rc_noprompt=0; wait "${pid_noprompt}" || rc_noprompt=$?
          rc_coreprompt=0; wait "${pid_coreprompt}" || rc_coreprompt=$?

          echo "::group::admin · primary (exit ${rc_primary})"
          cat primary.log
          echo "::endgroup::"
          echo "::group::admin · second validator (exit ${rc_second})"
          cat second.log
          echo "::endgroup::"
          echo "::group::admin · no context prompt (advisory, exit ${rc_noprompt})"
          cat noprompt.log
          echo "::endgroup::"
          echo "::group::admin · core prompt only (advisory, exit ${rc_coreprompt})"
          cat coreprompt.log
          echo "::endgroup::"

          echo "primary_exit=${rc_primary}" >> "$GITHUB_OUTPUT"
          echo "second_exit=${rc_second}" >> "$GITHUB_OUTPUT"

          # Exit 3 is a crash, not a verdict — no advisory window may downgrade
          # it. A green job that actually crashed is worse than a red one, and
          # that is exactly what happened when a report-rendering bug got
          # absorbed by the re-baselining window.
          failed=0
          if [ "${rc_primary}" -eq 3 ] || [ "${rc_second}" -eq 3 ]; then
            echo "::error::an eval run crashed before producing a verdict (see the logs above)."
            exit 1
          fi
          # The drift window covers BOTH gating arms, and it did not always: it
          # was written for `rc_primary` only, so a drifted catalogue still
          # failed the job through `rc_second`. Measured on run 31112700814,
          # where the primary passed and the pinned gpt-4o-mini missed its core
          # gate by a single fixture (35/42 = 83% against 85%) while the
          # catalogue was known-drifted — the exact condition this window exists
          # to tolerate, arriving through the one arm it did not cover.
          #
          # Covering the weaker arm is not a loosening. Both arms answer the same
          # fixtures against the same drifted tool descriptions, and gpt-4o-mini
          # is the more sensitive of the two: fixed model, tighter margins, so it
          # crosses its threshold on drift the primary absorbs. A window that
          # protects only the arm least likely to need it protects nothing.
          # An explicit `if` rather than `[ "${rc}" -eq 0 ] && continue`. The
          # latter is in fact safe — `set -e` ignores a failing left-hand side of
          # an AND-OR list — but this step already carries one scar from a `-e`
          # subtlety (the `wait` note above), and a gate is the wrong place to
          # make a reader work that rule out.
          for arm in "primary:${rc_primary}" "second validator:${rc_second}"; do
            name="${arm%:*}"
            rc="${arm##*:}"
            if [ "${rc}" -eq 0 ]; then
              continue
            fi
            if [ "${DRIFTED}" = "true" ]; then
              echo "::warning::admin · ${name} failed (exit ${rc}), treated as advisory because the tool catalogue has drifted from the committed baseline."
            else
              echo "::error::admin · ${name} failed (exit ${rc})."
              failed=1
            fi
          done
          exit "${failed}"

      - name: Compare models
        id: eval_compare
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          primary="results/eval-primary.json"
          second="results/eval-second-validator.json"
          # Deliberately not `continue-on-error`: that reports a failed step as
          # successful, which already bit us once. Skip explicitly instead, so
          # the exit code stays meaningful when --gate is turned on.
          if [ ! -f "${primary}" ] || [ ! -f "${second}" ]; then
            echo "Skipping cross-model comparison: a report is missing (one of the eval steps did not finish)." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python -m eval.compare_runs "${primary}" "${second}" \
            --min-pass-rate 0.9 \
            --min-pass-rate-second 0.85 \
            --gate both \
            --output "results/eval-comparison.json"

      - name: Upload admin results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-results
          path: results/
          retention-days: 14
          if-no-files-found: warn

      - name: Dump symfony server logs on failure
        if: failure()
        uses: ./.github/actions/dump-logs

      - name: Stop Shopware
        if: always()
        working-directory: shopware
        run: symfony server:stop 2>/dev/null || true


  # ---------------------------------------------------------------------------
  # 2b. The Store/UCP suite, independent of the admin suite — which it was not
  # before. A single failing admin fixture short-circuited every step below it,
  # so this reported `skipped`, which reads exactly like "the plugin is missing"
  # and cost a round of chasing a composer problem that did not exist.
  # ---------------------------------------------------------------------------
  store-eval:
    name: Store eval
    needs: static
    # store_ready is the preflight's verdict: if one UCP tool cannot run, none of
    # the 45 fixtures measure anything, and the run is pure spend.
    if: ${{ !cancelled() && needs.static.result != 'skipped' && needs.static.outputs.store_plugin_ok == 'true' && needs.static.outputs.store_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Bootstrap Python
        uses: ./.github/actions/bootstrap

      - name: Set up the lane
        id: lane
        uses: ./.github/actions/setup-lane
        with:
          shopware_repo: ${{ env.SHOPWARE_REPO }}
          shopware_ref: ${{ github.event.inputs.shopware_ref }}
          event_name: ${{ github.event_name }}
          app_url: ${{ env.APP_URL }}
          run_store: ${{ env.RUN_STORE }}
          dev_tools_ref: ${{ github.event.inputs.dev_tools_ref }}
          merchant_tools_ref: ${{ github.event.inputs.merchant_tools_ref }}
          agentic_commerce_ref: ${{ github.event.inputs.agentic_commerce_ref }}
          plugins_pat: ${{ secrets.PLUGINS_PAT }}
          github_token: ${{ github.token }}

      # The verdicts the static job measured. Same code and same plugins on both
      # lanes, so its findings hold here; without it every fixture is graded,
      # including those for tools already proven broken.
      - name: Download static results
        uses: actions/download-artifact@v7
        with:
          name: static-results

      - name: Run Store API LLM eval (advisory)
        if: ${{ !cancelled() && env.RUN_STORE == 'true' && steps.lane.outputs.store_plugin_ok == 'true' }}
        continue-on-error: true
        env:
          SW_BASE_URL: ${{ env.APP_URL }}
          SW_SC_ACCESS_KEY: ${{ steps.lane.outputs.sc_access_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_PROVIDER: ${{ env.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          args=()
          [ -n "${EVAL_PROVIDER}" ] && args+=(--provider "${EVAL_PROVIDER}")
          [ -n "${EVAL_MODEL}" ] && args+=(--model "${EVAL_MODEL}")
          # --advisory: this step is continue-on-error, so its row must not be
          # read as a gating verdict. Without the suite label it rendered as a
          # third, unexplained openai/gpt-4o result.
          # Triage matters more here than on admin: every UCP tool is unsafe to
          # execute (no dryRun, no committed Store snapshot), so this suite is
          # graded on selection alone and its failures cluster — order-get and
          # checkout-get trade prompts. The arms are what say whether that is a
          # description collision or the discovery layer.
          if [ "${TRIAGE}" = "true" ]; then args+=(--triage); fi

          # --output is fixed rather than left to the default timestamped name
          # so the summary step can name this report explicitly for the per-tool
          # scorecard, the way it already does for the two admin runs.
          # --tool-health: a fixture whose expected tool the static job proved
          # broken is skipped with that reason rather than graded. A plugin bug
          # is not a description problem, and rediscovering one costs a full
          # model pass per fixture. The file arrives from the static-results
          # artifact; if it is absent, everything is graded.
          python -m eval.runner --endpoint store "${args[@]}" \
            --output "results/eval-store.json" \
            --summary-row "results/rows/3-store.json" \
            --suite-label "store · UCP" \
            --tool-health "results/tool-health-store.json" \
            --advisory

      - name: Upload store results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-results
          path: results/
          retention-days: 14
          if-no-files-found: warn

      - name: Dump symfony server logs on failure
        if: failure()
        uses: ./.github/actions/dump-logs

      - name: Stop Shopware
        if: always()
        working-directory: shopware
        run: symfony server:stop 2>/dev/null || true


  # ---------------------------------------------------------------------------
  # 3. One render, after everything. `!cancelled()` rather than `success()`: a
  # failed eval is exactly when the summary is worth reading.
  # ---------------------------------------------------------------------------
  report:
    name: Report
    needs: [static, admin-eval, store-eval]
    if: ${{ !cancelled() && needs.static.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout evals repo
        uses: actions/checkout@v7

      - name: Bootstrap Python
        uses: ./.github/actions/bootstrap

      # Every job wrote into results/. Merging them into one tree is what lets
      # the summary render a single table rather than one per job — the same
      # reason the runs emit JSON rows instead of markdown.
      - name: Download all results
        uses: actions/download-artifact@v7
        with:
          path: artifacts
        continue-on-error: true

      - name: Collect results
        run: |
          set -euo pipefail
          mkdir -p results/rows tool-history
          # Two layouts, because upload-artifact strips the common prefix. The
          # static job lists two paths (results/ and tool-history/), so the
          # common root is the workspace and the archive keeps `results/...`.
          # The admin and store jobs list one, `results/`, so THAT becomes the
          # root and their files land at the top level of the archive.
          #
          # Only the prefixed form was handled, so every admin and store report
          # was silently dropped here: the job summary rendered 187 bytes and
          # cost drift reported "could not read results/eval-primary.json" on
          # every run since the jobs were split. Handling both is what keeps a
          # fifth job from repeating it.
          for dir in artifacts/*/; do
            if [ -d "${dir}results" ]; then
              cp -r "${dir}results/." results/
            else
              cp -r "${dir}"*.json results/ 2>/dev/null || true
              if [ -d "${dir}rows" ]; then cp -r "${dir}rows/." results/rows/ || true; fi
            fi
            if [ -d "${dir}tool-history" ]; then cp -r "${dir}tool-history/." tool-history/ || true; fi
          done
          echo "Collected:"; ls -1 results/ results/rows 2>/dev/null || true

      # The previous run's report, for the cost comparison at the end. A cache
      # rather than an artifact download: restore-keys falls back to the most
      # recent entry with this prefix, so there is no API call and no run-id
      # bookkeeping. On a first run, or when the cache has expired, nothing is
      # restored and cost_drift says it has nothing to compare against.
      #
      # Cache scoping does something useful for free here: a PR branch can read
      # main's cache but writes to its own, so a PR is measured against main's
      # last nightly and cannot poison the baseline for anyone else.
      - name: Restore previous cost baseline
        uses: actions/cache/restore@v5
        with:
          path: baseline
          key: eval-cost-baseline-${{ github.run_id }}
          restore-keys: eval-cost-baseline-

      # One render for the whole job. The three eval runs are separate
      # processes, so they emit JSON rows rather than markdown — appended
      # markdown from separate processes cannot form a single table, which is
      # why this used to be three one-row tables with the comparison wedged in
      # between them.
      #
      # The condition matches the other post-eval steps rather than always():
      # it must still run when the gate FAILS (that is when the summary is most
      # worth reading), but not when setup died before the primary eval, where
      # it would only turn one real failure into two.
      #
      # No continue-on-error, for the reason stated on the compare step: it
      # reports a failed step as successful. A broken renderer should be
      # visible; the read paths inside summary.py are the defensive part.
      - name: Write job summary
        if: ${{ !cancelled() && needs.admin-eval.result != 'skipped' }}
        run: |
          # --reports names this job's three reports explicitly. It must not
          # become a glob over results/: that directory is committed and holds
          # every historical report, so a glob would pool runs from months ago —
          # against older descriptions and older fixtures — into a table
          # presented as this job's. A report that did not run is simply absent.
          #
          # Both snapshots, so the one summary carries both catalogues and the
          # static description lint. tool-history/ arrives from static-results;
          # store.json is absent on any run whose preflight did not get that far,
          # which omits that section rather than failing.
          # Redirected, not piped: summary.py prints the markdown to stdout and
          # writes GITHUB_STEP_SUMMARY itself, so capturing stdout gives the PR
          # comment step the same document without rendering it twice. A redirect
          # also keeps python's own exit status, which `| tee` would replace with
          # tee's.
          python -m eval.summary \
            --rows "results/rows" \
            --comparison "results/eval-comparison.json" \
            --tools "tool-history/latest.json" \
            --store-tools "tool-history/store.json" \
            --reports "results/eval-primary.json" \
                      "results/eval-second-validator.json" \
                      "results/eval-no-prompt.json" \
                      "results/eval-core-prompt.json" \
                      "results/eval-store.json" > eval-summary.md
          # Still to the log, so a run remains readable without the artifact.
          cat eval-summary.md

      # The same summary as a single PR comment, updated in place on every run.
      #
      # The job summary is kept rather than replaced: it costs nothing, and it is
      # the only rendering that exists for scheduled runs and for pushes, where
      # there is no PR to comment on. What this adds is that a reviewer sees the
      # numbers in the PR instead of having to open the run, then the job, then
      # the summary.
      #
      # One comment, edited, never a second one. A new comment per run buries the
      # conversation on a branch that gets a few pushes, and the marker below is
      # what makes "find mine and edit it" possible — GitHub has no native
      # concept of a sticky comment.
      #
      # Not run for forks: a pull_request from a fork gets a read-only token, so
      # posting would fail on something unrelated to the eval. Non-fatal either
      # way, since a comment is a convenience and the artifact plus job summary
      # carry the same content.
      - name: Comment the summary on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.admin-eval.result != 'skipped' }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- mcp-evals-summary -->';
            // GitHub rejects a comment body over 65536 characters. The failure
            // detail scales with the number of failures, so the worst run
            // produces the longest body — exactly when losing it would hurt.
            const LIMIT = 65000;

            let body = fs.readFileSync('eval-summary.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = `${MARKER}\n### MCP eval results\n[Run #${context.runNumber}](${runUrl}) · \`${context.sha.slice(0, 7)}\`\n\n`;

            if (head.length + body.length > LIMIT) {
              const note = '\n\n---\n\n**Truncated** — see the job summary or the uploaded artifact for the full report.\n';
              body = body.slice(0, LIMIT - head.length - note.length) + note;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: head + body,
              });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: head + body,
              });
              core.info('Created the summary comment');
            }

      # Advisory, and non-gating by construction — cost_drift always exits 0.
      # A cost regression is invisible in the pass rate: discovery taking two
      # extra search rounds per fixture, or a tool that starts returning ten
      # times the payload, moves the bill and nothing else.
      - name: Cost drift (advisory)
        if: ${{ !cancelled() && needs.admin-eval.result != 'skipped' }}
        run: |
          python -m eval.cost_drift \
            --current "results/eval-primary.json" \
            --previous "baseline/eval-primary.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # Only the nightly writes the baseline. A PR run saving its own numbers
      # would make the next PR's comparison meaningless — the point of
      # comparison is a known-good scheduled run on trunk, not whatever landed
      # in CI most recently.
      - name: Save cost baseline
        if: ${{ github.event_name == 'schedule' && !cancelled() && needs.admin-eval.result != 'skipped' }}
        run: |
          mkdir -p baseline
          cp results/eval-primary.json baseline/ 2>/dev/null || true

      - name: Persist cost baseline
        if: ${{ github.event_name == 'schedule' && !cancelled() && needs.admin-eval.result != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: baseline
          key: eval-cost-baseline-${{ github.run_id }}

      - name: Open a reconciliation PR (nightly only)
        if: ${{ github.event_name == 'schedule' && (needs.static.outputs.drift == 'true' || needs.static.outputs.snapshot_changed == 'true') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SW_SHA: ${{ needs.static.outputs.shopware_sha }}
        run: |
          set -euo pipefail
          # One branch per upstream sha: a second nightly on the same trunk commit
          # updates the existing PR instead of opening another.
          BRANCH="chore/reconcile-mcp-drift-${SW_SHA:0:12}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          echo "$SW_SHA" > shopware.sha
          git add shopware.sha tool-history/latest.json
          # The Store snapshot rides along. Without this it would only ever be a
          # per-run artifact, and everything waiting on it — correct
          # expected_toolset values, dryRun read from schemas instead of guessed,
          # Store drift — would stay blocked indefinitely.
          if [ -f tool-history/store.json ]; then git add tool-history/store.json; fi

          if git diff --cached --quiet; then
            echo "Nothing to reconcile after all — no commit, no PR."
            exit 0
          fi

          git show "origin/${GITHUB_REF_NAME}:tool-history/latest.json" > /tmp/baseline.json 2>/dev/null || true
          python -m eval.drift --old /tmp/baseline.json --new tool-history/latest.json \
            --heading "What moved upstream" > /tmp/body.md

          {
            echo ""
            echo "Opened automatically by the nightly eval run against \`trunk\`."
            echo "Bumps \`shopware.sha\` to \`$SW_SHA\` and refreshes the catalogue baseline together,"
            echo "so the next run can attribute its own diff instead of re-reporting this one."
            echo ""
            echo "**Check before merging:** a tool added here needs fixtures, and a tool removed"
            echo "means its fixtures will start skipping. Descriptions changing is the ordinary case."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> /tmp/body.md

          git commit -q -m "chore(tool-history): reconcile baseline with trunk ${SW_SHA:0:12}" \
                        -m "Opened by the nightly eval run. See the PR body for what moved."
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json number --jq .number > /dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file /tmp/body.md
            echo "Updated the existing reconciliation PR for $BRANCH."
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
              --title "chore(tool-history): reconcile baseline with trunk ${SW_SHA:0:12}" \
              --body-file /tmp/body.md
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tool-history snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-history-${{ github.run_id }}
          path: tool-history/
          if-no-files-found: ignore
          retention-days: 14

