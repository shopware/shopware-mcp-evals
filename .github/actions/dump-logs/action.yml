name: Dump server logs
description: >
  Tail the symfony-cli and Shopware logs after a failure, so a lane that died
  mid-run leaves something to read in the job output. Called with `if: failure()`
  from each job that brings a lane up. Verbatim in three jobs before this — the
  kind of copy that drifts, since a fix to one is easy to forget in the others.

runs:
  using: composite
  steps:
    - name: Dump symfony server logs
      shell: bash
      run: |
        LOG_DIR="$HOME/.config/symfony-cli/log"
        if [ ! -d "$LOG_DIR" ]; then
          echo "No symfony log dir at $LOG_DIR"
          exit 0
        fi
        # tail (not follow) every log file under the symfony-cli log dir
        for f in "$LOG_DIR"/*.log "$LOG_DIR"/*/*.log; do
          [ -f "$f" ] || continue
          echo "=== $f (last 200 lines) ==="
          tail -n 200 "$f" || true
        done
        # Also dump Shopware's own var/log if present
        SW_LOG="${{ github.workspace }}/shopware/var/log"
        if [ -d "$SW_LOG" ]; then
          for f in "$SW_LOG"/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 200 lines) ==="
            tail -n 200 "$f" || true
          done
        fi
