# Model prices, in US dollars per 1,000,000 tokens.
#
# Hand-maintained on purpose: no provider exposes an API that returns its own
# price list, so this table cannot be derived and will go stale silently. Two
# things keep it honest:
#
#   * `verified` is rendered next to every cost figure the summary prints, so a
#     stale table is visible rather than authoritative. Update it when you check.
#   * tests/test_cost.py asserts that every model eval/runner.py can resolve has
#     an entry here. A new default model fails the unit tests rather than
#     quietly costing $0.00 in the report.
#
# `cached_input` is the rate for a cached prompt prefix. It is not an
# optimisation this harness opts into — OpenAI caches automatically above ~1k
# tokens — but the discount lands on the bill either way, so it is priced.
# `cache_write` is the rate for prompt tokens written into the cache. The
# gpt-5.6-* and gpt-6-* models bill writes automatically at 1.25x input and
# report them as `cache_write_tokens`; a model without the key has its writes
# (if it reports any) priced at its input rate.
#
# All OpenAI rates: Standard tier, short context, from
# https://platform.openai.com/docs/pricing.

verified: "2026-09-23"

models:
  # The primary until 2026-09-23. Output and cached input were estimates until 2026-09-23 (3.00 and 0.375),
  # which put this model's share of a run ~55% above the bill: cached input is
  # two thirds of its input tokens.
  gpt-5.4-mini:
    input: 0.75
    output: 4.50
    cached_input: 0.075

  # Candidates that were trialled against it.
  gpt-5.4-nano:
    input: 0.20
    output: 1.25
    cached_input: 0.02
  gpt-5-mini:
    input: 0.25
    output: 2.00
    cached_input: 0.025
  gpt-5.6-luna:
    input: 0.20
    output: 1.20
    cached_input: 0.02
    cache_write: 0.25
  # Primary gating model (eval/runner.py PROVIDER_DEFAULTS["openai"]).
  # Callable with the repo's key although /v1/models does not list it.
  gpt-6-luna:
    input: 0.10
    output: 0.50
    cached_input: 0.01
    cache_write: 0.125

  # Pinned second validator.
  gpt-4o-mini:
    input: 0.15
    output: 0.60
    cached_input: 0.075

  # PROVIDER_DEFAULTS["anthropic"].
  #
  # Checked 2026-09-02 against Anthropic's published per-model rates: $3.00 in,
  # $15.00 out. The launch promotion ($2.00/$10.00) ran to 2026-08-31 and has
  # expired, so the standard rate is the right one to carry. cached_input is
  # the 0.1x cache-read rate.
  claude-sonnet-5:
    input: 3.00
    output: 15.00
    cached_input: 0.30

  # The previous default, kept because `--model claude-sonnet-4-6` still
  # resolves and an unpriced model renders "unpriced" rather than failing.
  # Same rates as its successor.
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cached_input: 0.30

  # PROVIDER_DEFAULTS["github"] — GitHub Models bills nothing per token; it is
  # rate-limited instead, which is why the suite tracks throttling separately.
  mistral-ai/mistral-medium-2505:
    input: 0.0
    output: 0.0
    cached_input: 0.0

  # A model running on the developer's own machine via LM Studio. Genuinely
  # free, so 0.0 is the true rate and not a placeholder — the run renders
  # $0.00 rather than "unpriced", which is the honest reading.
  #
  # The name is what PROVIDER_DEFAULTS resolves for --provider lmstudio when no
  # --model is given. A real local model name (qwen/qwen3.6-35b-a3b and the
  # like) has no entry and will render "unpriced", which is also honest: nothing
  # here knows it is free.
  local-model:
    input: 0.0
    output: 0.0
    cached_input: 0.0

ci:
  # GitHub-hosted Linux runners are free on public repositories. Set the real
  # per-minute rate here if this repo is billed, so the summary's headline
  # figure is the whole cost of a run rather than just the LLM half.
  runner_usd_per_minute: 0.0
