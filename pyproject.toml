[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopware-mcp-evals"
version = "0.1.0"
description = "Two-layer test suite for the Shopware MCP server"
requires-python = ">=3.14"

# Deliberately empty. The pinned/ranged dependency sets live in
# eval/requirements.txt (runtime) and requirements-dev.txt (tooling), and the
# asymmetry between them is a documented decision. Repeating those constraints
# here would give them two sources of truth that drift silently, so CI installs
# the requirements files and then adds this package with `--no-deps`.
dependencies = []

# An editable install is what makes `import mcp_client` work from anywhere
# without a sys.path prelude. Before this existed every entry point opened with
# `sys.path.insert(...)` plus `# noqa: E402` on each following import — 22 lines
# of workaround across the repo — and the two modules both named `run` resolved
# by search-path order, which put eval/run.py in front of functional/run.py for
# anything that guessed wrong. They are `runner.py` under their own packages now.
#
# This list is exhaustive and NOT inferred: a new top-level module that is not
# named here is simply absent from the install, and CI is where you find out.
# `lane` was added and omitted, so a fresh `pip install -e . --no-deps` gave
# `ModuleNotFoundError: No module named 'lane'` on 14 test modules while a stale
# local editable install kept resolving it. After touching this line, re-run
# `pip install -e . --no-deps` locally, or your environment stops matching CI's.
[tool.setuptools]
py-modules = ["lane", "mcp_client", "ownership", "toolclass", "toollint", "ucp"]

[tool.setuptools.packages.find]
include = ["eval*", "functional*"]
exclude = ["functional.ci*", "tests*", "results*", "tool-history*"]

# Fixture YAML sits next to the runner that reads it.
[tool.setuptools.package-data]
eval = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the installed package rather than fiddling with sys.path per test file.
addopts = "-q"

[tool.coverage.run]
source = ["eval", "functional", "lane", "mcp_client", "ownership", "toolclass", "toollint", "ucp"]
# Branch coverage, because statement coverage counts an `if` as covered when only
# one side ever runs — and the untaken side is where the skip reasons, the error
# budget and the gate thresholds live.
branch = true

[tool.coverage.report]
# The `if __name__` guards and the provider SDK branches cannot be reached
# without a live key, and counting them just adds permanent noise to the number.
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

# A floor, not a target. Set here rather than as a --cov-fail-under flag in the
# workflow so a local `pytest --cov` enforces the same number CI does — a
# threshold you only discover in CI is one you find out about after pushing.
#
# It ratchets: whenever the suite reaches a new high, this is raised to hold it,
# so coverage can only ever go up. Leave ~1-2 points of slack below the measured
# number for ordinary churn — not for platform drift, which is far smaller than
# that: measured on identical code, linux CI reported 83.04% against darwin's
# ~83%, so the two agree to well under a point. Do not read the slack as room
# for a real dip.
#
# History: 80 while the run sat at ~83%. Dropping baseline mode removed its
# branches and the replacement tests reached run_fixture_discovery, which had no
# direct coverage at all, taking it to ~87% — raised to 85. The per-tool
# scorecard, catalogue lint, negative fixtures and cost accounting all landed as
# pure modules with full test coverage, taking it to ~91%.
#
# The part worth covering next is functional/runner's verify_* checks, at 79% —
# by some distance the largest remaining gap, and the one that has to close
# before this can move much past 92.
fail_under = 90
